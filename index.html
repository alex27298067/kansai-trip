<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {
	border-bottom-left-radius: 2px;
	border-bottom-right-radius: 2px;
	}

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {
	font: bold 18px 'Lucida Console', Monaco, monospace;
	text-indent: 1px;

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;
	background: rgba(255, 255, 255, 0.8);
	margin: 0;
	}
.leaflet-control-attribution,
.leaflet-control-scale-line {
	padding: 0 5px;
	color: #333;
	line-height: 1.4;
	}
.leaflet-control-attribution a {
	text-decoration: none;
	}
.leaflet-control-attribution a:hover,
.leaflet-control-attribution a:focus {
	text-decoration: underline;
	}
.leaflet-attribution-flag {
	display: inline !important;
	vertical-align: baseline !important;
	width: 1em;
	height: 0.6669em;
	}
.leaflet-left .leaflet-control-scale {
	margin-left: 5px;
	}
.leaflet-bottom .leaflet-control-scale {
	margin-bottom: 5px;
	}
.leaflet-control-scale-line {
	border: 2px solid #777;
	border-top: none;
	line-height: 1.1;
	padding: 2px 5px 1px;
	white-space: nowrap;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	background: rgba(255, 255, 255, 0.8);
	text-shadow: 1px 1px #fff;
	}
.leaflet-control-scale-line:not(:first-child) {
	border-top: 2px solid #777;
	border-bottom: none;
	margin-top: -2px;
	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {
	border-bottom: 2px solid #777;
	}

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	box-shadow: none;
	}
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	border: 2px solid rgba(0,0,0,0.2);
	background-clip: padding-box;
	}


/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;
	text-align: left;
	border-radius: 12px;

  color:var(--day);display:flex;align-items:center;justify-content:center}
.pl .idx svg{width:16px;height:16px}
.pl .mid{flex:1;min-width:0}
.pl .n{font-size:13.8px;font-weight:700;line-height:1.45;letter-spacing:.1px}
.pl .ja{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.pl .plb{display:flex;align-items:center;gap:8px;margin-top:9px;padding-left:43px}
.pl .plb .tags{margin:0;flex:1;min-width:0}
.pl .act{flex:0 0 auto;display:flex;gap:6px}
.iconbtn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;background:#EAF1FD;color:#1A5FC4;box-shadow:var(--shL);flex:0 0 34px}
.iconbtn svg{width:16px;height:16px}
.iconbtn:active{transform:scale(.94)}
.iconbtn.g{background:var(--sunk);color:var(--ink2);border:1px solid var(--line)}
.nb{background:var(--card);border-radius:15px;padding:12px 13px;margin-bottom:9px;
  box-shadow:var(--sh);display:flex;gap:12px;align-items:center}
.nb .dist{flex:0 0 58px;text-align:center}
.nb .dist b{display:block;font-size:15.5px;font-weight:800;color:var(--day);line-height:1.15;
  letter-spacing:-.3px}
.nb .dist span{font-size:9.5px;color:var(--muted);font-weight:600}
.nb .mid{flex:1;min-width:0}
.nb .mid .n{font-size:13.5px;font-weight:700;line-height:1.45}
.nb .mid .a{font-size:10.5px;color:var(--muted);margin-top:2px;font-weight:600}
.gpsbar{border-radius:13px;padding:12px 14px;font-size:12px;line-height:1.75;margin-bottom:12px;
  background:var(--accentT);color:#8A5A20;border:1px solid #F2DFC2}
.gpsbar.ok{background:var(--naraT);color:#35603F;border-color:#CFE5D6}
.gpsbar.err{background:#FCEDEA;color:#8E3B2C;border-color:#F3D0C8}

/* ================= util ================= */
.ph{border-bottom:1px solid var(--line2);padding:11px 0;display:flex;gap:10px;align-items:flex-start}
.ph:last-child{border:none;padding-bottom:2px}
.ph .txt{flex:1;min-width:0}
.ph .zh{font-size:12.5px;font-weight:700;color:var(--ink2)}
.ph .ja{font-size:14.5px;color:var(--kyoto);margin-top:3px;font-weight:700;line-height:1.55}
.ph .ro{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.2px}
.tel{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.tel:last-child{border:none;padding-bottom:2px}
.tel .ic2{flex:0 0 38px;height:38px;border-radius:12px;background:var(--sunk);
  display:flex;align-items:center;justify-content:center;font-size:17px;border:1px solid var(--line)}
.tel .n{flex:1;min-width:0}
.tel .n b{font-size:13px;display:block;line-height:1.45}
.tel .n span{font-size:10.5px;color:var(--muted);line-height:1.55;display:block;margin-top:2px}
.tel .call{background:var(--p2);color:#fff;border-radius:10px;padding:9px 13px;font-size:12px;
  font-weight:700;flex:0 0 auto}
.addr{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:10px}
.addr .ja{font-size:15px;font-weight:700;line-height:1.75}
.addr .ph2{color:#B4ABA0;font-weight:400;font-size:12.5px}
.fx{display:flex;gap:9px;align-items:center;margin-top:10px}
.fx label{font-size:12px;color:var(--muted);font-weight:700;flex:0 0 62px}
.fx input{flex:1;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:16px;
  text-align:right;background:var(--sunk);min-width:0;font-weight:700}
.fx input:focus{outline:none;border-color:var(--accent);background:#fff}
.fx input[readonly]{background:var(--dayT);color:var(--day);border-color:transparent}
.ck{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line2)}
.ck:last-child{border:none;padding-bottom:2px}
.ck .t{flex:1;font-size:12px;line-height:1.7;color:var(--ink2)}
.ck .t b{display:block;font-size:13.5px;margin-bottom:3px;color:var(--ink)}
.ck.on .t{opacity:.5}.ck.on .t b{text-decoration:line-through}

/* ================= nav ================= */
nav{position:fixed;left:0;right:0;bottom:0;z-index:90;max-width:540px;margin:0 auto;
  background:rgba(255,255,255,.94);backdrop-filter:saturate(1.7) blur(18px);
  -webkit-backdrop-filter:saturate(1.7) blur(18px);
  border-top:1px solid var(--line2);padding-bottom:var(--safeb);display:flex;
  box-shadow:0 -2px 18px -10px rgba(27,32,37,.28)}
nav button{flex:1;height:var(--nav);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:var(--muted);font-size:9.5px;font-weight:700;
  letter-spacing:.3px;position:relative;transition:color .18s}
nav button svg{width:20px;height:20px;stroke-width:1.9}
nav button.on{color:var(--day)}
nav button.on:before{content:"";position:absolute;top:5px;width:26px;height:3px;border-radius:99px;
  background:var(--day)}
.view{display:none;animation:fade .22s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <h1><span class="leaf"></span>關西秋旅 · 京都大阪奈良</h1>
      <div class="sub" id="topsub">11/7（六）- 11/15（日）· 9 天 8 夜</div>
    </div>
    <div class="dcount" id="dcount"><b>–</b><span>DAY</span></div>
  </header>

  <section class="view on" id="v-now"><div class="wrap" id="nowBody"></div></section>

  <section class="view" id="v-plan">
    <div class="chipbar sticky" id="dayChips"></div>
    <div class="wrap" id="planBody"></div>
  </section>

  <section class="view" id="v-map">
    <div class="wrap">
      <div class="seg" id="mapSeg">
        <button data-mode="geo" class="on">實景地圖</button>
        <button data-mode="rail">路網圖</button>
      </div>

      <div id="modeGeo">
        <div class="chipbar inline" id="mapChips"></div>
        <div class="mapbox"><div id="map"></div><div class="tilebadge" id="tileBadge"></div></div>
        <div class="btns">
          <button class="btn" id="locBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
            我的位置</button>
          <button class="btn" id="fitBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>
            重新置中</button>
          <button class="btn" id="tileBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            換底圖</button>
        </div>
        <p class="mnote" id="mapNote"></p>
      </div>

      <div id="modeRail" style="display:none">
        <div class="mapbox"><div id="railmap"></div></div>
        <div class="btns">
          <button class="btn" id="railFit">全圖</button>
          <button class="btn" id="railOsaka">大阪市區</button>
          <button class="btn" id="railKyoto">京都</button>
        </div>
        <p class="mnote">可雙指縮放與拖曳。點站名看那一站在行程裡的用途。★ 為兩處住宿。<br>
          示意圖，站距非實際比例。</p>
        <div class="legend" id="railLegend"></div>
      </div>
    </div>
  </section>

  <section class="view" id="v-place">
    <div class="wrap">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜尋地點、日文名、區域…" autocomplete="off">
      </div>
      <div class="chipbar inline" id="areaChips"></div>
      <div id="placeBody"></div>
    </div>
  </section>

  <section class="view" id="v-near">
    <div class="wrap">
      <div id="gpsBox"></div>
      <div class="chipbar inline" id="pChips"></div>
      <div id="nearBody"></div>
    </div>
  </section>

  <section class="view" id="v-util"><div class="wrap" id="utilBody"></div></section>

  <nav id="nav"></nav>
</div>

function gview(o){
  return o.pre==='exact'
    ?'https://www.google.com/maps/search/?api=1&query='+o.lat+'%2C'+o.lng
    :'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(o.ja||o.n);
}
function gnav(o){
  return o.pre==='exact'
    ?'https://www.google.com/maps/dir/?api=1&destination='+o.lat+'%2C'+o.lng+'&travelmode=transit'
    :'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(o.ja||o.n)+'&travelmode=transit';
}
function dist(a,b,c,d){const R=6371,r=Math.PI/180,dLa=(c-a)*r,dLo=(d-b)*r;
  const x=Math.sin(dLa/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(x))}
const fmtD=k=>k<1?Math.round(k*1000)+'m':k.toFixed(k<10?1:0)+'km';
const walk=k=>{const m=Math.round(k*1000/80);return m<1?'就在旁邊':m<=90?'走 '+m+' 分':'建議搭車'};
async function copy(t,btn){
  try{await navigator.clipboard.writeText(t)}
  catch(e){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';
    a.style.opacity='0';document.body.appendChild(a);a.select();
    try{document.execCommand('copy')}catch(_){}a.remove()}
  if(btn){const o=btn.innerHTML;btn.innerHTML=IC.check;setTimeout(()=>btn.innerHTML=o,1200)}
}

          '</div>':'')+

/* ===================== 轉乘簡圖 ===================== */
function routeStrip(d){
  if(!d.route||!d.route.length)return'';
  let h='',prev=null;
  d.route.forEach(r=>{
    if(r.f!==prev){ if(prev!==null)h+='<div class="gap"></div>';
      h+='<div class="st">'+esc(r.f)+'</div>' }
    h+='<div class="ln"><div class="bar" style="background:'+r.c+'"></div>'+
       '<div class="lb">'+esc(r.l)+'</div><div class="mn">約 '+esc(r.m)+' 分</div>'+
       (r.n?'<div class="nt">'+esc(r.n)+'</div>':'')+'</div>';
    h+='<div class="st">'+esc(r.t)+'</div>';
    prev=r.t;
  });
  return'<div class="route"><div class="rh">當天移動</div><div class="legs">'+h+'</div></div>';
}

/* ===================== 路網圖 ===================== */
const RSC=8;                       // 示意圖座標放大倍率
let railMap=null, railLabels=[];
const rxy=s=>[-s.y*RSC, s.x*RSC];  // CRS.Simple：lat 用 -y 讓上北下南
function initRail(){
  if(railMap){setTimeout(()=>railMap.invalidateSize(),60);return}
  railMap=L.map('railmap',{crs:L.CRS.Simple,minZoom:-3,maxZoom:3,zoomSnap:.25,
    attributionControl:false,zoomControl:true});
  // 步行轉乘
  RAIL.WALK.forEach(([a,b])=>L.polyline([rxy(RAIL.S[a]),rxy(RAIL.S[b])],
    {color:'#BDB4A6',weight:2.5,dashArray:'3,6'}).addTo(railMap));
  // 路線（先白底再上色）
  RAIL.L.forEach(l=>L.polyline(l.p.map(id=>rxy(RAIL.S[id])),
    {color:'#FBF9F5',weight:11,lineCap:'round',lineJoin:'round'}).addTo(railMap));
  RAIL.L.forEach(l=>L.polyline(l.p.map(id=>rxy(RAIL.S[id])),
    {color:l.c,weight:6.5,lineCap:'round',lineJoin:'round'}).addTo(railMap)
    .bindTooltip(l.n,{sticky:true}));
  // 站點
  Object.entries(RAIL.S).forEach(([id,s])=>{
    const big=!!s.big;
    const mk=L.circleMarker(rxy(s),{radius:big?7:5,color:'#33302B',weight:big?2.8:2.1,
      fillColor:'#fff',fillOpacity:1}).addTo(railMap);
    if(s.star)L.circleMarker(rxy(s),{radius:3,color:'#E8873B',weight:0,
      fillColor:'#E8873B',fillOpacity:1}).addTo(railMap);
    const lines=RAIL.L.filter(l=>l.p.includes(id)).map(l=>
      '<span style="display:inline-block;border-radius:4px;padding:1px 6px;margin:2px 3px 0 0;'+
      'font-size:10.5px;color:#fff;background:'+l.c+'">'+esc(l.n)+'</span>').join('');
    mk.bindPopup('<div class="pop"><b>'+esc(s.n)+'</b>'+
      '<div class="ar">'+esc(s.ja)+(s.star?'　·　★ '+esc(s.star):'')+'</div>'+
      (RAIL.USE[id]?'<div class="ls">'+esc(RAIL.USE[id])+'</div>':'')+
      '<div style="margin-top:7px">'+lines+'</div></div>',{maxWidth:250});
    const lft=RAIL.LEFT.indexOf(id)>=0, btm=RAIL.BELOW.indexOf(id)>=0;
    const lbl=L.marker(rxy(s),{interactive:false,
      icon:L.divIcon({className:'',iconSize:[0,0],iconAnchor:[-11,7],
        html:'<div class="rlbl'+(big?' big':'')+(s.star?' star':'')+
             (btm?' btm':(lft?' lft':''))+'">'+esc(s.n)+'</div>'})});
    railLabels.push({m:lbl,big:big,core:RAIL.L0.indexOf(id)>=0||!!s.star});
  });
  railMap.on('zoomend',railLabelToggle);
  railFitAll();
  setTimeout(()=>{railMap.invalidateSize();railFitAll()},160);
  // 圖例
  $('#railLegend').innerHTML='<h4>路線圖例</h4>'+RAIL.L.map(l=>
    '<div class="li"><i style="background:'+l.c+'"></i><span>'+esc(l.n)+'</span></div>').join('');
}
function railLabelToggle(){
  const z=railMap.getZoom();
  railLabels.forEach(({m,big,core})=>{
    const show = z>=-1.8 ? true : (z>=-2.45 ? big : core);
    if(show){ if(!railMap.hasLayer(m))m.addTo(railMap) }
    else if(railMap.hasLayer(m))railMap.removeLayer(m);
  });
}
function railBounds(ids){
  return L.latLngBounds(ids.map(i=>rxy(RAIL.S[i])));
}
function railFitAll(){
  railMap.fitBounds(railBounds(Object.keys(RAIL.S)),
    {paddingTopLeft:[40,30],paddingBottomRight:[74,30]});
  railLabelToggle();
}

/* ===================== 地圖 ===================== */
const TILES=[
 {n:'Voyager',u:'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
  s:'abcd',a:'&copy; OpenStreetMap &copy; CARTO',max:20},
 {n:'Positron',u:'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  s:'abcd',a:'&copy; OpenStreetMap &copy; CARTO',max:20},
 {n:'OSM',u:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',a:'&copy; OpenStreetMap',max:19},
 {n:'Esri',u:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
  a:'&copy; Esri',max:19}
];
function useTiles(i,manual){
  if(!mapObj)return;
  tileIdx=(i+TILES.length)%TILES.length;
  const t=TILES[tileIdx];
  if(tileLayer)mapObj.removeLayer(tileLayer);
  let loaded=0,failed=0;
  tileLayer=L.tileLayer(t.u,{subdomains:t.s||'abc',maxZoom:t.max,detectRetina:true,
    attribution:t.a,crossOrigin:true}).addTo(mapObj);
  tileLayer.on('load',()=>{$('#tileBadge').style.display='none'});
  tileLayer.on('tileload',()=>{loaded++;$('#tileBadge').style.display='none'});
  tileLayer.on('tileerror',()=>{
    failed++;
    if(loaded===0&&failed>=5&&!manual&&tileIdx<TILES.length-1){useTiles(tileIdx+1)}
    else if(loaded===0&&failed>=5){
      const b=$('#tileBadge');b.textContent='底圖載入失敗，標記仍可使用';b.style.display='block'}
  });
  $('#mapNote').innerHTML='底圖：'+t.n+'　·　數字是當天的行程順序，虛線是動線。'+
    '同一棟樓的店（例如 HEP FIVE 那三家）會合併成一個標記。'+
    '<br>底圖載不出來時可按「換底圖」切換供應商。';
}
function mapPoints(){
  const out=[],seen=new Set();
  const src=mapDay==='all'?DAYS.map((d,i)=>({d,i})):[{d:DAYS[+mapDay],i:+mapDay}];
  src.forEach(({d,i})=>d.it.forEach(x=>{
    if(x.o&&!seen.has(x.o)&&!POI[x.o].noMap){seen.add(x.o);out.push({id:x.o,di:i})}}));
  return out;
}
function renderMapChips(){
  $('#mapChips').innerHTML='<button class="chip'+(mapDay==='all'?' on plain':'')+'" data-m="all">全部地點</button>'+
    DAYS.map((d,i)=>'<button class="chip'+(mapDay===i?' on '+d.th:'')+'" data-m="'+i+'">'+
      d.d.slice(5).replace('-','/')+'<span class="d">'+esc(d.city)+'</span></button>').join('');
  $$('#mapChips .chip').forEach(b=>b.onclick=()=>{
    mapDay=b.dataset.m==='all'?'all':+b.dataset.m;
    if(mapDay!=='all')setTheme(DAYS[mapDay].th);
    renderMapChips();drawMarkers()});
  const on=$('#mapChips .chip.on');
  if(on)on.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
}
function initMap(){
  if(mapObj){setTimeout(()=>mapObj.invalidateSize(),60);return}
  mapObj=L.map('map',{zoomControl:true,attributionControl:true,tap:false}).setView([34.85,135.6],9);
  useTiles(0);
  drawMarkers();
  mapObj.on('zoomend',renderClusters);
  setTimeout(()=>mapObj.invalidateSize(),120);   /* 容器剛顯示，尺寸要重算 */
  setTimeout(()=>{mapObj.invalidateSize();drawMarkers()},450);
}
let MG=[],MSEQ=false,MDI=0,polyLayer=null;
function drawMarkers(focus){
  if(!mapObj)return;
  const pts=mapPoints(),byKey={};MG=[];MSEQ=mapDay!=='all';MDI=MSEQ?+mapDay:0;
  pts.forEach(({id,di})=>{
    const o=POI[id];if(!o)return;
    const k=o.lat.toFixed(4)+','+o.lng.toFixed(4);
    if(byKey[k]){byKey[k].list.push(o);return}
    byKey[k]={lat:o.lat,lng:o.lng,di,list:[o]};MG.push(byKey[k]);
  });
  if(polyLayer){mapObj.removeLayer(polyLayer);polyLayer=null}
  if(MSEQ&&MG.length>1)
    polyLayer=L.polyline(MG.map(g=>[g.lat,g.lng]),{color:THC[DAYS[MDI].th]||'#888',
      weight:3.5,opacity:.4,dashArray:'2,9',lineCap:'round'}).addTo(mapObj);
  if(focus)mapObj.setView([focus.lat,focus.lng],16);
  else if(MG.length)mapObj.fitBounds(MG.map(g=>[g.lat,g.lng]),{padding:[42,42],maxZoom:15});
  renderClusters();
}
function popHTML(list,no){
  const head=list[0];
  return'<div class="pop"><b>'+(no?no+'. ':'')+
    esc(list.length>1?head.area+'（'+list.length+' 個地點）':head.n)+'</b>'+
    '<div class="ar">'+esc(head.area)+(head.pre==='area'?'　·　位置概略':'')+'</div>'+
    (list.length>1?'<div class="ls">'+list.map(o=>'· '+esc(o.n)+
      (o.p?' <b style="color:#B24630">P'+o.p+'</b>':'')).join('<br>')+'</div>'
      :(head.p?'<div class="ls">優先度 P'+head.p+'</div>':''))+
    '<div class="acts"><a href="'+gview(head)+'" target="_blank" rel="noopener">Google Maps</a>'+
    '<a class="alt" href="'+gnav(head)+'" target="_blank" rel="noopener">導航</a></div></div>';
}
/* 依目前縮放的螢幕距離把太靠近的標記合成一顆，避免整團疊死 */
function renderClusters(){
  if(!mapObj)return;
  markers.forEach(m=>mapObj.removeLayer(m));markers=[];
  const z=mapObj.getZoom();
  const P=MG.map((g,i)=>({g,i,pt:mapObj.project([g.lat,g.lng],z)}));
  const used=new Array(P.length).fill(false),cl=[];
  for(let i=0;i<P.length;i++){
    if(used[i])continue;used[i]=true;
    const m=[P[i]];
    for(let j=i+1;j<P.length;j++){
      if(used[j])continue;
      if(P[i].pt.distanceTo(P[j].pt)<40){m.push(P[j]);used[j]=true}
    }
    cl.push(m);
  }
  cl.forEach(m=>{
    const first=m[0],c=THC[DAYS[first.g.di].th]||'#888';
    const many=m.length>1;
    const lat=m.reduce((s,x)=>s+x.g.lat,0)/m.length, lng=m.reduce((s,x)=>s+x.g.lng,0)/m.length;
    const label=many?m.length:(MSEQ?first.i+1:(first.g.list[0].p||'·'));
    const sz=many?32:26;
    const ic=L.divIcon({className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],
      html:'<div style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:'+c+
        ';border:'+(many?3:2.5)+'px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);display:flex;'+
        'align-items:center;justify-content:center;color:#fff;font-size:'+(many?12.5:11.5)+
        'px;font-weight:800;font-family:inherit'+
        (many?';outline:4px solid '+c+'33':'')+'">'+label+'</div>'});
    const mk=L.marker([lat,lng],{icon:ic,zIndexOffset:many?900:first.i,riseOnHover:true}).addTo(mapObj);
    if(many){
      mk.bindTooltip(m.length+' 個地點，點一下放大',{direction:'top',offset:[0,-18]});
      mk.on('click',()=>mapObj.fitBounds(m.map(x=>[x.g.lat,x.g.lng]),
        {padding:[70,70],maxZoom:17}));
    }else{
      mk.bindPopup(popHTML(first.g.list,MSEQ?first.i+1:0),{maxWidth:250});
    }
    markers.push(mk);
  });
}

function renderPlaces(){

    (areaFilter==='all'||o.area===areaFilter)&&

  const groups={};

          '<div class="n">'+esc(o.n)+'</div>'+
          (o.ja&&o.ja!==o.n?'<div class="ja">'+esc(o.ja)+'</div>':'')+
          '</div></div>'+
          '<div class="plb"><div class="tags">'+
            (o.p?'<span class="pill p'+o.p+'">P'+o.p+'</span>':'')+
            (kindTag?'<span class="pill g">'+kindTag+'</span>':'')+
            ds.map(i=>'<span class="pill d" data-jump="'+i+'">D'+(i+1)+'</span>').join('')+
            (o.pre==='area'?'<span class="pill g">概略</span>':'')+
          '</div><div class="act">'+
            '<a class="iconbtn" href="'+gview(o)+'" target="_blank" rel="noopener" title="在 Google Maps 開啟">'+IC.mapPin+'</a>'+
            '<button class="iconbtn g" data-cp="'+esc(o.ja||o.n)+'" title="複製日文名稱">'+IC.copy+'</button>'+
            '<button class="iconbtn g" data-focus="'+id+'" title="在內建地圖顯示">'+IC.map+'</button>'+
          '</div></div></div>'}).join('')}).join('');
  $('#placeBody').innerHTML=h;

      const m=markers.find(m=>Math.abs(m.getLatLng().lat-o.lat)<2e-3&&
                              Math.abs(m.getLatLng().lng-o.lng)<2e-3);
      if(m&&m.getPopup&&m.getPopup())m.openPopup()},280)});
}

/* ===================== 附近 ===================== */
function askGeo(force){
  if(!navigator.geolocation){geoState='no';renderNear();return}
  if(geo&&!force){renderNear();return}
  geoState='ask';renderNear();
  navigator.geolocation.getCurrentPosition(
    p=>{geo={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
      geoState='ok';renderNear();if(mapObj)showMe()},
    e=>{geoState=e.code===1?'deny':'fail';renderNear()},
    {enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}
let meMarker=null;
function showMe(){
  if(!geo||!mapObj)return;
  if(meMarker)mapObj.removeLayer(meMarker);
  meMarker=L.circleMarker([geo.lat,geo.lng],{radius:8,color:'#fff',weight:3,
    fillColor:'#1A73E8',fillOpacity:1}).addTo(mapObj).bindPopup('我的位置');
  mapObj.setView([geo.lat,geo.lng],15);
}
function renderPChips(){
  const o=[['all','全部'],['1','P1 一定要去'],['2','P2 順路必去'],['3','P3 時間寬裕']];
  $('#pChips').innerHTML=o.map(([v,l])=>
    '<button class="chip'+(pFilter===v?' on plain':'')+'" data-p="'+v+'">'+l+'</button>').join('');
  $$('#pChips .chip').forEach(b=>b.onclick=()=>{pFilter=b.dataset.p;renderPChips();renderNear()});
}
function renderNear(){
  const M={idle:['','準備定位…'],
    ask:['','正在取得你的位置，請允許瀏覽器的定位權限。'],
    ok:['ok','已定位。以下依直線距離由近到遠排序。'],
    deny:['err','定位權限被拒絕。請到瀏覽器設定開啟此頁的定位，或改用下方的區域清單。'],
    fail:['err','抓不到 GPS 訊號（室內或地下街常見）。走到戶外再試一次，或改用下方的區域清單。'],
    no:['err','這個瀏覽器不支援定位，請改用下方的區域清單。']}[geoState]||['',''];
  $('#gpsBox').innerHTML='<div class="gpsbar '+M[0]+'">'+M[1]+
    (geo&&geo.acc>0?'<br><span class="xs">精度約 ±'+Math.round(geo.acc)+' 公尺</span>':'')+'</div>'+
    '<div class="btns" style="margin:0 0 14px"><button class="btn'+(geo?'':' pri')+'" id="reGeo">'+
    IC.near+(geo?'重新定位':'開啟定位')+'</button></div>';
  $('#reGeo').onclick=()=>askGeo(true);

  let list=Object.entries(POI).filter(([,o])=>o.p>0)
    .filter(([,o])=>pFilter==='all'||o.p===+pFilter);
  let h='';
  if(geo){
    const s=list.map(([id,o])=>({id,o,d:dist(geo.lat,geo.lng,o.lat,o.lng)})).sort((a,b)=>a.d-b.d);
    const near=s.filter(x=>x.d<=5),far=s.filter(x=>x.d>5);
    h+='<div class="sec"><i></i><h2>5 公里內</h2><span class="cnt">'+near.length+' 個</span></div>';
    h+=near.length?near.map(nbCard).join('')
      :'<div class="empty">這附近 5 公里內沒有行程上的景點。<br>下面是全部地點依距離排序。</div>';
    if(far.length)h+='<div class="sec" style="margin-top:22px"><i></i><h2>再遠一點</h2></div>'+
      far.slice(0,14).map(nbCard).join('');
  }else{
    h+='<div class="sec"><i></i><h2>依區域瀏覽</h2></div>';
    h+=AREAS.map(a=>{
      const items=list.filter(([,o])=>o.area===a);
      if(!items.length)return'';
      return'<div class="card"><div class="b sm" style="margin-bottom:2px">'+esc(a)+
        '<span class="xs muted">　'+items.length+' 個地點</span></div>'+
        items.map(([id,o])=>'<div class="row sp" style="padding:9px 0;border-top:1px solid var(--line2)">'+
        '<div style="min-width:0"><div class="sm b">'+esc(o.n)+'</div></div>'+
        '<div class="row" style="flex:0 0 auto;gap:8px"><span class="pill p'+o.p+'">P'+o.p+'</span>'+
        '<a class="iconbtn" href="'+gview(o)+'" target="_blank" rel="noopener">'+IC.mapPin+'</a>'+
        '</div></div>').join('')+'</div>'}).join('');
  }
  $('#nearBody').innerHTML=h;
}
function nbCard(x){
  const o=x.o;
  return'<div class="nb"><div class="dist"><b>'+fmtD(x.d)+'</b><span>'+walk(x.d)+'</span></div>'+
    '<div class="mid"><div class="n">'+esc(o.n)+'</div>'+
    '<div class="a">'+esc(o.area)+(o.pre==='area'?'　·　位置概略':'')+'</div>'+
    '<div class="tags"><span class="pill p'+o.p+'">P'+o.p+'</span>'+
    (o.kind==='food'?'<span class="pill g">餐飲</span>':'')+
    (o.kind==='shop'?'<span class="pill g">購物</span>':'')+
    (o.url?'<a class="pill g" href="'+o.url+'" target="_blank" rel="noopener">官網</a>':'')+
    '</div></div>'+
    '<a class="iconbtn" href="'+gview(o)+'" target="_blank" rel="noopener">'+IC.mapPin+'</a></div>';
}

    '<div class="hint">範圍：心齋橋／難波／大阪難波／近鐵日本橋周邊</div></div>';

  h+='<div class="sec"><i></i><h2>緊急電話</h2></div><div class="card">'+
    TELS.map(t=>'<div class="tel"><div class="ic2">'+t.i+'</div>'+

  h+='<div class="sec"><i></i><h2>日文應急短句</h2></div>';
  h+=PHRASES.map(g=>'<div class="card"><div class="b sm" style="color:var(--day);margin-bottom:3px">'+
    esc(g.g)+'</div>'+g.l.map(([zh,ja,ro])=>
    '<div class="ph"><div class="txt"><div class="zh">'+esc(zh)+'</div>'+
    '<div class="ja">'+esc(ja)+'</div><div class="ro">'+esc(ro)+'</div></div>'+
    '<button class="iconbtn g" data-cp2="'+esc(ja)+'">'+IC.copy+'</button></div>').join('')+'</div>').join('');

  h+='<div class="sec"><i></i><h2>匯率速查</h2></div><div class="card">'+
    '<div class="fx"><label>日圓 JPY</label><input id="fxJ" type="number" inputmode="decimal" value="1000"></div>'+
    '<div class="fx"><label>台幣 TWD</label><input id="fxT" type="number" readonly></div>'+
    '<div class="fx"><label>1 JPY =</label><input id="fxR" type="number" inputmode="decimal" step="0.001" value="'+rate+'"></div>'+
    '<div class="hint">匯率請自己改成當天的實際數字，這裡不會連網抓。</div></div>';

  h+='<div class="sec"><i></i><h2>出發前確認清單</h2></div><div class="card">'+
    CHECKS.map((c,i)=>'<div class="ck'+(ck[i]?' on':'')+'" data-ci="'+i+'">'+
    '<div class="cb">'+IC.check+'</div><div class="t"><b>'+esc(c[0])+'</b>'+c[1]+'</div></div>').join('')+
    '</div>';

  h+='<div class="sec"><i></i><h2>關於這個檔案</h2></div><div class="card"><div class="sm ink2" style="line-height:1.9">'+
    '單一 HTML 檔。行程、地點、日文短句、緊急電話都內建，不用連網也看得到；'+
    '需要網路的只有內建地圖的底圖，以及點開 Google Maps。<br><br>'+
    '打勾、筆記、地址、匯率存在這支手機的瀏覽器裡'+
    (store.ok()?'':'（<b>目前這個環境不允許儲存，重新整理後會清空</b>）')+'，換裝置不會同步。<br><br>'+
    '標示「位置概略」的地點代表座標只到區域級，地圖連結會改用日文名稱搜尋。</div>'+
    '<div class="btns"><button class="btn" id="resetBtn">清除所有打勾與筆記</button></div></div>';

  $('#utilBody').innerHTML=h;
  $$('#utilBody [data-edit]').forEach(b=>b.onclick=()=>{

  $('#resetBtn').onclick=()=>{if(confirm('確定要清除所有打勾與筆記嗎？')){
    store.set('done',{});store.set('notes',{});store.set('checks',{});renderPlan();renderUtil()}};
}

/* ===================== 導覽 ===================== */
const TABS=[['now','今日',IC.home],['plan','行程',IC.list],['map','地圖',IC.map],
            ['place','地點',IC.pin],['near','附近',IC.near],['util','工具',IC.tool]];
$('#nav').innerHTML=TABS.map(([v,l,i])=>'<button data-v="'+v+'">'+i+l+'</button>').join('');
function go(v){
  $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $$('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  window.scrollTo(0,0);
  if(v==='now')renderNow();
  if(v==='plan'){renderChips();renderPlan()}
  if(v==='map'){ if(mapMode==='rail')initRail(); else {renderMapChips();initMap()} }
  if(v==='place'||v==='near'||v==='util'){
    const i=nowInfo().di;setTheme(DAYS[i>=0?i:curDay].th)}
  if(v==='place'){renderAreaChips();renderPlaces()}
  if(v==='near'){renderPChips();(!geo&&geoState==='idle')?askGeo():renderNear()}
  if(v==='util')renderUtil();
}
$$('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#locBtn').onclick=()=>{geo?showMe():askGeo(true)};
$('#fitBtn').onclick=()=>drawMarkers();
$('#tileBtn').onclick=()=>useTiles(tileIdx+1,true);
let mapMode='geo';
$$('#mapSeg button').forEach(b=>b.onclick=()=>{
  mapMode=b.dataset.mode;
  $$('#mapSeg button').forEach(x=>x.classList.toggle('on',x===b));
  $('#modeGeo').style.display = mapMode==='geo'?'':'none';
  $('#modeRail').style.display= mapMode==='rail'?'':'none';
  if(mapMode==='rail')initRail(); else {renderMapChips();initMap()}
});
$('#railFit').onclick=()=>railFitAll();
$('#railOsaka').onclick=()=>{railMap.fitBounds(railBounds(

$('#q').oninput=e=>{q=e.target.value;renderPlaces()};

function boot(){
  const info=nowInfo();
  if(info.di>=0){curDay=info.di;mapDay=info.di}
  $('#topsub').textContent='11/7（六）- 11/15（日）· 9 天 8 夜';
  renderNow();
}
boot();
setInterval(()=>{if($('#v-now').classList.contains('on')&&window.scrollY<40)renderNow()},60000);
window.addEventListener('resize',()=>{if(mapObj)mapObj.invalidateSize();
  if(railMap)railMap.invalidateSize()});
</script>
