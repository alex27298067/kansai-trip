<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {
	border-bottom-left-radius: 2px;
	border-bottom-right-radius: 2px;
	}

/* zoom control */

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {
	font: bold 18px 'Lucida Console', Monaco, monospace;
	text-indent: 1px;
	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;
	background: rgba(255, 255, 255, 0.8);
	margin: 0;
	}
.leaflet-control-attribution,
.leaflet-control-scale-line {
	padding: 0 5px;
	color: #333;
	line-height: 1.4;
	}
.leaflet-control-attribution a {
	text-decoration: none;
	}
.leaflet-control-attribution a:hover,
.leaflet-control-attribution a:focus {
	text-decoration: underline;
	}
.leaflet-attribution-flag {
	display: inline !important;
	vertical-align: baseline !important;
	width: 1em;
	height: 0.6669em;
	}
.leaflet-left .leaflet-control-scale {
	margin-left: 5px;
	}
.leaflet-bottom .leaflet-control-scale {
	margin-bottom: 5px;
	}
.leaflet-control-scale-line {
	border: 2px solid #777;
	border-top: none;
	line-height: 1.1;
	padding: 2px 5px 1px;
	white-space: nowrap;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	background: rgba(255, 255, 255, 0.8);
	text-shadow: 1px 1px #fff;
	}
.leaflet-control-scale-line:not(:first-child) {
	border-top: 2px solid #777;
	border-bottom: none;
	margin-top: -2px;
	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {
	border-bottom: 2px solid #777;
	}

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	box-shadow: none;
	}
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	border: 2px solid rgba(0,0,0,0.2);
	background-clip: padding-box;
	}


/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;
	text-align: left;
	border-radius: 12px;

body[data-enh-theme="night"] .card,

body[data-enh-theme="night"] .legend,
body[data-enh-theme="night"] .pl,
body[data-enh-theme="night"] .it,

body[data-enh-theme="night"] .decisionmetric{background:var(--sunk);border-color:var(--line)}

body[data-enh-theme="night"] .decisionstep,
body[data-enh-theme="night"] .decisionwhen,
body[data-enh-theme="night"] .decisionwhen b,
body[data-enh-theme="night"] .decisionnote b{color:var(--ink)}

body[data-enh-theme="night"] .decisionbadge{background:#183246;color:#a9d9ee}
body[data-enh-theme="night"] .decisionresult{background:#183126;border-color:#315440;color:#c9e7d3}

body[data-enh-theme="night"] .auditstate.warn{background:#382b1e;color:#e1bd83}
body[data-enh-theme="night"] .auditstate.check{background:#30263b;color:#d3b5e7}
body[data-enh-theme="night"] .kv.warn{color:#e1bd83;border:1px solid #564429}
body[data-enh-theme="night"] .enh-system-state.warn{color:#e1bd83}
body[data-enh-theme="night"] .note:focus,
body[data-enh-theme="night"] .fx input:focus{background:var(--card)}
body[data-enh-theme="night"] .enh-delete{background:#3a2322!important;color:#f0b4a8!important;border-color:#653b36!important}
body[data-enh-theme="night"] .enh-result,
body[data-enh-theme="night"] .enh-setting,
body[data-enh-theme="night"] .enh-ops-card,
body[data-enh-theme="night"] .enh-field input,
body[data-enh-theme="night"] .enh-field select,
body[data-enh-theme="night"] .enh-field textarea,

body[data-enh-theme="night"] .railbox{filter:brightness(.82) saturate(.9)}
body[data-enh-theme="night"] .enh-live-transit,
body[data-enh-theme="night"] .enh-day-ledger,
body[data-enh-theme="night"] .enh-expense-editor,
body[data-enh-theme="night"] .enh-route-change,
body[data-enh-theme="night"] .enh-transit-main,

body[data-enh-font="large"]{font-size:17px}
body[data-enh-font="large"] .sm{font-size:14px}
body[data-enh-font="large"] .xs{font-size:12.5px}

button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,
[tabindex]:focus-visible{outline:3px solid var(--enh-focus);outline-offset:3px}
.btn,.chip,.iconbtn,nav button,.decisiontab{touch-action:manipulation}
.btn:hover,.chip:hover,.iconbtn:hover{filter:brightness(.985);border-color:#d7cfc2}

.enh-header-actions{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.enh-head-btn{
  width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:var(--card);
  display:grid;place-items:center;color:var(--ink2);box-shadow:var(--shL);position:relative
}
.enh-head-btn svg{width:18px;height:18px}
.enh-head-btn .enh-label{display:none}
.enh-online-dot{position:absolute;right:7px;top:7px;width:7px;height:7px;border-radius:50%;
  border:2px solid var(--card);background:#2f9954}
.enh-online-dot.off{background:#c56545}

.enh-ops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 15px}
.enh-ops-card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);
  border-radius:17px;padding:14px 15px;min-height:98px;box-shadow:var(--sh);text-align:left}
.enh-ops-card:after{content:"";position:absolute;width:74px;height:74px;border-radius:50%;right:-24px;
  top:-25px;background:var(--tone,rgba(178,70,48,.09))}
.enh-ops-card .enh-kicker{display:block;color:var(--muted);font-size:9.5px;font-weight:850;
  letter-spacing:1.2px;text-transform:uppercase}
.enh-ops-card strong{display:block;font-size:21px;line-height:1.15;margin-top:8px;letter-spacing:-.4px}
.enh-ops-card small{display:block;color:var(--muted);font-size:10.5px;line-height:1.5;margin-top:5px}
.enh-ops-card.action{cursor:pointer}
.enh-ops-card.action:hover{transform:translateY(-1px);box-shadow:0 10px 25px -17px rgba(20,30,40,.5)}

.enh-notice{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border-radius:15px;
  background:#fff7e9;border:1px solid #eedbb9;color:#745227;margin-bottom:13px}
body[data-enh-theme="night"] .enh-notice{background:#30271a;border-color:#564429;color:#ead1a4}
.enh-notice svg{width:18px;height:18px;flex:0 0 18px;margin-top:1px}
.enh-notice div{font-size:11.5px;line-height:1.65}
.enh-notice b{display:block;color:inherit;font-size:12.5px;margin-bottom:1px}

.enh-plan-tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 10px}
.enh-plan-tools .btn{width:100%;min-width:0;padding-inline:10px;justify-content:center;gap:6px}
.enh-plan-tools svg{width:16px;height:16px;flex:0 0 16px}
.enh-custom-badge{display:inline-flex;align-items:center;gap:5px;background:#efe8ff;color:#6950a5;
  border:1px solid #ddd0fb;border-radius:999px;font-size:10px;font-weight:800;padding:3px 8px}
.enh-delete{background:#fff1ee!important;color:#a44937!important;border-color:#f0cdc6!important}

.enh-live-transit{width:100%;display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:11px;
  padding:12px 14px;margin:0 0 13px;border:1px solid #cbddee;border-radius:16px;background:linear-gradient(145deg,#f6fbff,#eef6fc);
  color:var(--ink);text-align:left;box-shadow:var(--sh)}
.enh-live-transit>svg{width:24px;height:24px;color:#1671b9}.enh-live-transit>span{min-width:0}
.enh-live-transit small{display:block;color:#1671b9;font-size:8.5px;font-weight:900;letter-spacing:1px}
.enh-live-transit b{display:block;font-size:13px;margin-top:2px}.enh-live-transit em{display:block;color:var(--muted);
  font-size:10.5px;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.enh-live-transit>strong{font-size:10.5px;color:#1671b9}

.enh-day-ledger{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) auto;align-items:center;gap:10px;
  margin:0 0 13px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.enh-day-ledger>svg{width:21px;height:21px;color:#ad6a21}.enh-day-ledger span{min-width:0}
.enh-day-ledger small{display:block;color:var(--muted);font-size:9px}.enh-day-ledger b{display:block;font-size:13px;margin-top:2px}
.enh-day-ledger button{min-height:36px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--sunk);
  color:var(--ink2);font-size:9.5px;font-weight:800;white-space:nowrap}

.enh-expense-pill{display:inline-flex;align-items:center;margin-top:6px;min-height:28px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;
  background:var(--sunk);color:var(--muted);font-size:9.5px;font-weight:850;white-space:nowrap}
.enh-expense-pill.has-value{background:#fff3dc;border-color:#ead3a7;color:#895918}
body[data-enh-theme="night"] .enh-expense-pill.has-value{background:#382b1e;border-color:#63492c;color:#e1bd83}
.enh-expense-editor{margin:10px 0;padding:11px;border:1px solid var(--line2);border-radius:13px;background:var(--sunk)}
.enh-expense-title{display:flex;align-items:center;gap:8px;margin-bottom:9px}.enh-expense-title svg{width:18px;height:18px;color:#ad6a21}
.enh-expense-title b{display:block;font-size:11.5px}.enh-expense-title small{display:block;color:var(--muted);font-size:9px;margin-top:1px}
.enh-expense-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:8px}
.enh-expense-grid label{display:flex;flex-direction:column;gap:4px;min-width:0}.enh-expense-grid label.full{grid-column:1/-1}
.enh-expense-grid label>span{font-size:9px;font-weight:800;color:var(--muted)}
.enh-expense-grid input,.enh-expense-grid select{width:100%;min-width:0;min-height:42px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--ink);padding:8px 10px;font-size:12px;box-sizing:border-box}
.enh-money-input{position:relative}.enh-money-input i{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-style:normal;
  color:#ad6a21;font-weight:900}.enh-money-input input{padding-left:27px;font-size:15px;font-weight:800}

.enh-place-filters{display:flex;gap:8px;overflow-x:auto;margin:0 -2px 12px;padding:2px 2px 4px;
  scrollbar-width:none}.enh-place-filters::-webkit-scrollbar{display:none}
.enh-filter{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:8px 12px;font-size:11.5px;font-weight:750;color:var(--ink2)}
.enh-filter.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.enh-fav{font-size:20px;color:#b9afa0;line-height:1}
.enh-fav.on{color:#e39a2e}
.pl[hidden],.sec[hidden]{display:none!important}

.enh-modal-lock{position:fixed!important;left:0;right:0;width:100%;overflow:hidden!important}
.enh-modal-host{position:fixed;left:0;right:0;top:var(--enh-vtop,0px);height:var(--enh-vvh,100dvh);
  z-index:999;pointer-events:none}
.enh-overlay{position:absolute;inset:0;background:rgba(10,18,28,.56);backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);opacity:0;transition:opacity .18s}
.enh-dialog{position:absolute;left:50%;bottom:0;width:min(680px,100%);max-height:min(86dvh,760px);
  transform:translate(-50%,105%);background:var(--bg);border-radius:24px 24px 0 0;
  box-shadow:0 -22px 70px rgba(8,15,22,.3);display:flex;flex-direction:column;transition:transform .22s ease}
.enh-modal-host.open{pointer-events:auto}.enh-modal-host.open .enh-overlay{opacity:1}
.enh-modal-host.open .enh-dialog{transform:translate(-50%,0)}
.enh-dialog-head{padding:17px 18px 14px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:12px;background:var(--enh-surface);border-radius:24px 24px 0 0}
.enh-dialog-head>div{flex:1;min-width:0}.enh-dialog-head .ey{font-size:9px;letter-spacing:1.5px;
  color:var(--day);font-weight:850}.enh-dialog-head h2{font-size:18px;line-height:1.35;margin-top:2px}
.enh-close{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;font-size:21px;color:var(--muted)}
.enh-dialog-body{padding:16px 18px calc(18px + var(--safeb));overflow:auto;overscroll-behavior:contain;
  min-height:0;-webkit-overflow-scrolling:touch}
.enh-seg{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;background:var(--line2);
  border-radius:13px;padding:4px;margin-bottom:14px}
.enh-seg button{border-radius:10px;padding:9px 8px;font-size:12px;font-weight:800;color:var(--muted)}
.enh-seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shL)}
.enh-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.enh-field{display:flex;flex-direction:column;gap:5px;min-width:0}.enh-field.full{grid-column:1/-1}
.enh-field label{font-size:10.5px;font-weight:800;color:var(--muted)}
.enh-field input,.enh-field select,.enh-field textarea{width:100%;border:1px solid var(--line);
  background:var(--card);border-radius:12px;padding:11px 12px;min-height:44px;min-width:0;
  max-width:100%;font-size:13px;box-sizing:border-box}
.enh-time-pair{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;min-width:0}
.enh-time-pair>.enh-field{width:100%;min-width:0}
.enh-time-pair input[type="time"]{-webkit-appearance:none;appearance:none;text-align:center;width:100%;min-width:0;display:block}
.enh-field textarea{min-height:82px;resize:vertical;line-height:1.6}
.enh-form-actions{display:flex;gap:9px;margin-top:15px}.enh-form-actions .btn{min-height:46px}
.enh-form-actions button:disabled,.btn:disabled{opacity:.42;cursor:not-allowed}

.enh-route-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.enh-route-summary>div{padding:10px;border:1px solid var(--line);border-radius:13px;background:var(--card)}
.enh-route-summary span{display:block;color:var(--muted);font-size:9px}.enh-route-summary b{display:block;font-size:18px;margin-top:3px}
.enh-route-summary b small{font-size:9px;color:var(--muted)}
.enh-route-change{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:9px;align-items:center;padding:10px 11px;
  margin-bottom:8px;border:1px solid var(--line);border-radius:13px;background:var(--card)}
.enh-route-change>span{width:27px;height:27px;display:grid;place-items:center;border-radius:9px;background:var(--dayT);color:var(--day);font-size:9px;font-weight:900}
.enh-route-change b,.enh-route-change small{display:block;font-size:10.5px;line-height:1.5}.enh-route-change small{color:var(--day);margin-top:3px}
.enh-route-change em{font-style:normal;font-size:9.5px;font-weight:850;color:#3b7851;white-space:nowrap}

.enh-live-stamp{display:flex;align-items:center;gap:7px;padding:8px 10px;margin-bottom:10px;border-radius:10px;background:var(--sunk);
  color:var(--muted);font-size:9.5px}.enh-live-stamp i{width:8px;height:8px;border-radius:50%;background:#2f9954}.enh-live-stamp i.off{background:#c56545}
.enh-live-stamp span{flex:1}.enh-live-stamp time{white-space:nowrap;font-variant-numeric:tabular-nums}
.enh-transit-main{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:11px;padding:14px;
  border:1px solid #bcd5e9;border-radius:15px;background:linear-gradient(145deg,#f5fbff,#e9f4fc);color:var(--ink);text-decoration:none}
.enh-transit-main>svg{width:25px;height:25px;color:#1671b9}.enh-transit-main b,.enh-transit-main small{display:block}
.enh-transit-main b{font-size:13px}.enh-transit-main small{font-size:9.5px;color:var(--muted);line-height:1.5;margin-top:2px}
.enh-transit-main strong{font-size:10px;color:#1671b9}.enh-transit-main.disabled{opacity:.7}
.enh-subhead{font-size:10px;font-weight:900;letter-spacing:.5px;color:var(--muted);margin:16px 0 7px;text-transform:uppercase}
.enh-transit-legs,.enh-source-grid{display:grid;gap:7px}.enh-transit-leg{display:flex;align-items:center;gap:9px;padding:10px 11px;
  border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.enh-transit-leg>span{flex:1;min-width:0}.enh-transit-leg b,.enh-transit-leg small{display:block}.enh-transit-leg b{font-size:11.5px}
.enh-transit-leg small{font-size:9.5px;color:var(--muted);line-height:1.45;margin-top:2px}.enh-transit-leg svg{width:17px;height:17px;color:var(--day)}
.enh-source-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.enh-source-link{display:block;position:relative;padding:11px;
  border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-height:72px}
.enh-source-link b,.enh-source-link small{display:block}.enh-source-link b{font-size:11px;padding-right:44px}.enh-source-link small{font-size:9px;
  color:var(--muted);line-height:1.45;margin-top:4px}.enh-source-link span{position:absolute;right:9px;top:10px;font-size:8.5px;color:var(--day);font-weight:850}

.enh-pdf-preview{display:flex;align-items:center;gap:12px;padding:13px;margin-bottom:12px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.enh-pdf-preview>svg{width:31px;height:31px;flex:0 0 31px;color:#ad513f}.enh-pdf-preview b,.enh-pdf-preview small{display:block}
.enh-pdf-preview b{font-size:13px}.enh-pdf-preview small{font-size:10px;color:var(--muted);line-height:1.55;margin-top:3px}
.enh-setting input[type="checkbox"]{width:24px;height:24px;accent-color:var(--day)}
.enh-pdf-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:13px}.enh-pdf-actions .btn{min-height:48px}

.enh-search-input{position:relative;margin-bottom:12px}
.enh-search-input input{width:100%;height:48px;border-radius:15px;border:1px solid var(--line);
  background:var(--card);padding:0 46px 0 15px;font-size:15px;box-shadow:var(--shL)}
.enh-search-input span{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:11px;
  color:var(--muted);font-weight:750}
.enh-search-results{display:flex;flex-direction:column;gap:8px;min-height:0}
.enh-result{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:11px 12px;min-height:60px}
.enh-result:hover{border-color:#cabdae}.enh-result .enh-rtype{width:34px;height:34px;border-radius:11px;
  background:var(--dayT);color:var(--day);display:grid;place-items:center;font-size:11px;font-weight:850}
.enh-result .enh-rmain{flex:1;min-width:0}.enh-result b{display:block;font-size:13px;line-height:1.45}
.enh-result small{display:block;color:var(--muted);font-size:10.5px;line-height:1.45;margin-top:2px}
.enh-empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:12.5px}

.enh-modal-host[data-enh-kind="search"] .enh-dialog-body{display:flex;flex-direction:column;overflow:hidden}
.enh-modal-host[data-enh-kind="search"] .enh-search-input{flex:0 0 auto}
.enh-modal-host[data-enh-kind="search"] .enh-search-results{flex:1 1 auto;overflow:auto;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.enh-modal-host[data-enh-kind="search"] .enh-dialog{overflow:hidden}
.enh-modal-host[data-enh-kind="search"] .enh-dialog-body{min-height:0}

.enh-status-editor{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:end;
  margin:10px 0;padding:10px 11px;border:1px solid var(--line2);border-radius:12px;background:var(--sunk)}
.enh-status-editor label{display:flex;flex-direction:column;gap:5px;min-width:0;color:var(--muted);
  font-size:9.5px;font-weight:800;letter-spacing:.25px}
.enh-status-editor select{width:100%;min-width:0;min-height:42px;border:1px solid var(--line);border-radius:10px;
  padding:8px 34px 8px 10px;background:var(--card);color:var(--ink);font-size:12px;font-weight:750}
.enh-status-reset{min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink2);font-size:10px;font-weight:750;white-space:nowrap}
.enh-status-reset[hidden]{display:none}
.enh-status-pill{cursor:help}
.enh-focus-row{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:8px;align-items:stretch}
.enh-focus-row select{min-width:0;border:1px solid var(--line);border-radius:13px;background:var(--card);
  color:var(--ink);padding:0 28px 0 9px;font-size:11px;font-weight:750}

.enh-settings{display:grid;gap:10px}
.enh-setting{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:15px;padding:13px 14px}.enh-setting>div{flex:1}.enh-setting b{font-size:13px;display:block}
.enh-setting small{font-size:10.5px;color:var(--muted);display:block;margin-top:2px}
.enh-toggle{width:48px;height:28px;border-radius:99px;background:#d8d0c5;padding:3px;transition:.18s}
.enh-toggle i{display:block;width:22px;height:22px;background:white;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,.18);transition:.18s}
.enh-toggle.on{background:var(--p2)}.enh-toggle.on i{transform:translateX(20px)}

.enh-backup{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:11px}
.enh-system-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.enh-system-row{display:grid;grid-template-columns:72px 1fr;gap:9px;align-items:start;padding:9px 0;
  border-top:1px solid var(--line2);font-size:11.5px;line-height:1.55}
.enh-system-state{font-size:10px;font-weight:850;border-radius:99px;padding:3px 7px;text-align:center;
  background:var(--naraT);color:var(--p2)}
.enh-system-state.warn{background:var(--accentT);color:#966125}

.enh-nearby-tools{grid-column:1/-1;min-width:0}

.enh-pdf-card{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:12px;margin-bottom:13px}

.enh-pdf-card b{font-size:13px}.enh-pdf-card small{font-size:10px;line-height:1.5;color:var(--muted);margin-top:3px}.enh-pdf-card .btn{white-space:nowrap}

.enh-print-only{display:none}
.enh-quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:11px}
.enh-quick-card{display:grid;grid-template-columns:44px minmax(0,1fr) 20px;align-items:center;gap:11px;
  min-height:82px;padding:13px 14px;border:1px solid var(--line);border-radius:16px;background:var(--card);
  color:var(--ink);box-shadow:var(--sh);text-decoration:none}

.enh-quick-card b{display:block;font-size:13px;line-height:1.45}

.enh-quick-card.toilet .enh-quick-icon{background:#eaf5ec;color:#327047}
.enh-toilet-card{margin-bottom:13px}

.enh-toilet-days small{display:block;font-size:8.5px;margin-top:1px;opacity:.72}

.enh-toilet-row{display:grid;grid-template-columns:25px minmax(0,1fr) 18px;align-items:center;gap:9px;
  min-height:46px;padding:8px 10px;color:var(--ink);border-top:1px solid var(--line2)}
.enh-toilet-row:first-of-type{border-top:0}.enh-toilet-row>span{width:24px;height:24px;border-radius:8px;

body[data-enh-theme="night"] .enh-quick-card.toilet .enh-quick-icon{background:#193328;color:#9ed2ad}

.enh-toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--safeb) + 15px);z-index:1200;
  transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#182536;color:white;
  border-radius:12px;padding:10px 14px;font-size:12px;font-weight:750;box-shadow:0 10px 30px rgba(0,0,0,.25);
  transition:.2s;max-width:calc(100% - 30px);text-align:center}

  .view>.wrap,.view>.chipbar,.view#v-util>.wrap{max-width:1180px;margin-left:auto;margin-right:auto}

  .chipbar.sticky{top:72px;padding-left:30px;padding-right:30px}
  #nowBody{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(330px,.85fr);gap:14px 18px;align-items:start}
  #nowBody>.hero,#nowBody>.enh-ops,#nowBody>.enh-notice,#nowBody>.todaybrief,#nowBody>.decisiondeck,
  #nowBody>.enh-live-transit,#nowBody>.route,#nowBody>.sec,#nowBody>.card,#nowBody>.btns,#nowBody>.chipbar{grid-column:1}

  #planBody{display:grid;grid-template-columns:minmax(330px,.78fr) minmax(520px,1.22fr);gap:14px 22px;align-items:start}
  #planBody>.dayhd,#planBody>.enh-plan-tools,#planBody>.enh-day-ledger,#planBody>.route,#planBody>.decisiondeck,#planBody>.auditcard,#planBody>.walk-card{grid-column:1}
  #planBody>.tl{grid-column:2;grid-row:1 / span 40;min-width:0;position:relative}

  #planBody>.enh-plan-tools{margin-bottom:0}
  #planBody>.walk-card .walk-map{height:360px}
  #v-map .wrap,#v-place .wrap,#v-near .wrap,#v-util .wrap{max-width:1180px}

  #placeBody{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px;align-items:start}
  #placeBody>.sec,#placeBody>.card,#placeBody>.empty{grid-column:1/-1}
  #placeBody>.pl{height:calc(100% - 10px)}
  #nearBody{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
  #nearBody>.sec,#nearBody>.empty{grid-column:1/-1}
  #utilBody{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px;align-items:start}

  .enh-dialog{left:calc(50% + var(--enh-sidebar)/2);bottom:50%;border-radius:24px;transform:translate(-50%,55%);

}

}

  .enh-transit-main{grid-template-columns:34px minmax(0,1fr)}.enh-transit-main>strong{grid-column:2}

<div id="app">

function gview(o){
  const query=o.ja||[o.n,o.area,'日本'].filter(Boolean).join(' ');
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(query);
}
function gnav(o){
  const destination=o.ja||[o.n,o.area,'日本'].filter(Boolean).join(' ');
  return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(destination)+
    '&travelmode=transit&dir_action=navigate';
}
function gmPlace(o){return o.ja||[o.n,o.area,'日本'].filter(Boolean).join(' ')}
function gmRoute(stops){
  if(stops.length<2)return stops.length?gview(stops[0].o):'#';
  const a=stops[0].o,b=stops[stops.length-1].o,mid=stops.slice(1,-1);
  return'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(gmPlace(a))+
    '&destination='+encodeURIComponent(gmPlace(b))+
    (mid.length?'&waypoints='+encodeURIComponent(mid.map(x=>gmPlace(x.o)).join('|')):'');
}
function dist(a,b,c,d){const R=6371,r=Math.PI/180,dLa=(c-a)*r,dLo=(d-b)*r;
  const x=Math.sin(dLa/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(x))}
const fmtD=k=>k<1?Math.round(k*1000)+'m':k.toFixed(k<10?1:0)+'km';

async function copy(t,btn){
  try{await navigator.clipboard.writeText(t)}
  catch(e){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';
    a.style.opacity='0';document.body.appendChild(a);a.select();
    try{document.execCommand('copy')}catch(_){}a.remove()}
  if(btn){const o=btn.innerHTML;btn.innerHTML=IC.check;setTimeout(()=>btn.innerHTML=o,1200)}
}

/* ===================== 轉乘簡圖 ===================== */
function routeStrip(d){
  if(!d.route||!d.route.length)return'';
  let h='',prev=null;
  d.route.forEach(r=>{
    if(r.f!==prev){ if(prev!==null)h+='<div class="gap"></div>';
      h+='<div class="st">'+esc(r.f)+'</div>' }
    h+='<div class="ln"><div class="bar" style="background:'+r.c+'"></div>'+
       '<div class="lb">'+esc(r.l)+'</div><div class="mn">約 '+esc(r.m)+' 分</div>'+
       (r.n?'<div class="nt">'+esc(r.n)+'</div>':'')+'</div>';
    h+='<div class="st">'+esc(r.t)+'</div>';
    prev=r.t;
  });
  return'<div class="route"><div class="rh">當天移動</div><div class="legs">'+h+'</div></div>';
}

/* ===================== 路網圖 ===================== */
const RSC=8;
let railMap=null, railLay='osaka', railDay='all', railLayers=[];
const rxy=(s)=>[-s.y*RSC, s.x*RSC];
/* 一個站可能有多種寫法（動物園前 / 新今宮、JR奈良站、關西機場 T1…）。 */
const rparts=s=>String(s).replace(/[\s（）()]/g,'').split(/[\/／・]/)
  .map(x=>x.replace(/(?:T[12]|第[一二12]航廈)$/i,'').replace(/站$|駅$/,'').replace(/住宿$/,'')
    .replace(/前夕陽ヶ丘$/,'前').replace(/^JR/,'').replace(/關西空港/g,'關西機場'))
  .filter(Boolean);
const rhit=(name,set)=>!!set&&rparts(name).some(x=>[...set].some(y=>x===y||
  (x.length>=3&&y.length>=3&&(x.includes(y)||y.includes(x)))));
const railLineHits=(line,S,hi)=>!hi?line.p.length:new Set(line.p.filter(id=>rhit(S[id].n,hi))).size;
const railLineText=s=>String(s).replace(/Osaka Metro|地下鐵|JR|特急|新快速|快速|直達|\d+[–—\-\d/]*\s*分|[\s（）()]/g,'').toLowerCase();
const railLineOn=(line,S,hi)=>{
  if(!hi)return true;
  if(railLineHits(line,S,hi)<2)return false;
  const routes=(DAYS[+railDay]&&DAYS[+railDay].route)||[],name=railLineText(line.n);
  return !routes.length||routes.some(r=>{
    if(String(r.c).toLowerCase()===String(line.c).toLowerCase())return true;
    const routeName=railLineText(r.l);
    return name.length>=3&&routeName.length>=2&&(routeName.includes(name)||name.includes(routeName));
  });
};

function initRail(){
  if(!railMap){
    railMap=L.map('railmap',{crs:L.CRS.Simple,minZoom:-4,maxZoom:4,zoomSnap:.25,
      attributionControl:false,zoomControl:true});
  }else{ railMap.invalidateSize() }
  drawRail();
}
function railDayStations(){
  if(railDay==='all')return null;
  const set=new Set();
  (DAYS[+railDay].route||[]).forEach(r=>{
    rparts(r.f).forEach(x=>set.add(x)); rparts(r.t).forEach(x=>set.add(x))});
  return set;
}
function railActiveLines(lay,hi){
  const all=lay.L.concat(lay.DASH||[]);
  return hi?all.filter(l=>railLineOn(l,lay.S,hi)):all;
}
function renderRailMeta(lay,hi){
  const used=hi?Object.values(lay.S).filter(s=>rhit(s.n,hi)).length:Object.keys(lay.S).length;
  const lines=railActiveLines(lay,hi);
  const active=hi?'D'+(+railDay+1)+' · '+DAYS[+railDay].d.slice(5).replace('-','/'):'全部日程';
  $('#railHead').innerHTML='<div class="rey">KANSAI TRANSIT · SCHEMATIC 2026</div><h3>'+esc(lay.title)+'</h3>'+ 
    '<p>'+esc(lay.sub)+'</p><div class="railstats"><span class="railstat"><b>'+used+'</b> 站</span>'+ 
    '<span class="railstat"><b>'+lines.length+'</b> '+(hi?'當日路線':'路線')+'</span><span class="railstat">'+esc(active)+'</span></div>';
  const walking=!hi||lay.WALK.some(([a,b])=>rhit(lay.S[a].n,hi)&&rhit(lay.S[b].n,hi));
  $('#railLegend').innerHTML=(lines.length?lines.map(l=>'<span class="railli"><i style="background:'+l.c+'"></i>'+esc(l.n)+'</span>').join(''):
    '<span class="railli neutral">此分區沒有完整的當日乘車區間；可切換分區或選「全部」查看完整路網。</span>')+
    (walking?'<span class="railli walk"><i></i>站間步行轉乘</span>':'');
}
function drawRail(){
  const lay=RAIL.LAYOUTS[railLay], S=lay.S;
  railLayers.forEach(l=>railMap.removeLayer(l)); railLayers=[];
  const hi=railDayStations();
  const activeLines=railActiveLines(lay,hi),dim=hi?(activeLines.length?0.075:0.13):1;
  const add=l=>{l.addTo(railMap);railLayers.push(l);return l};

  lay.WALK.forEach(([a,b])=>{
    const on=!hi||(rhit(S[a].n,hi)&&rhit(S[b].n,hi));
    add(L.polyline([rxy(S[a]),rxy(S[b])],{color:'#8F979C',weight:2.3,dashArray:'2,6',
      opacity:on?1:dim,lineCap:'round'}));
  });
  (lay.DASH||[]).forEach(l=>{
    const on=railLineOn(l,S,hi),opacity=on?1:dim;
    add(L.polyline(l.p.map(i=>rxy(S[i])),{color:'#F7F8F7',weight:9,dashArray:'8,6',opacity,lineCap:'round'}));
    add(L.polyline(l.p.map(i=>rxy(S[i])),{color:l.c,weight:4.5,dashArray:'8,6',opacity,lineCap:'round'}))
      .bindTooltip(l.n,{sticky:true});
  });
  lay.L.forEach(l=>{
    const on=railLineOn(l,S,hi),opacity=on?1:dim;
    add(L.polyline(l.p.map(i=>rxy(S[i])),
      {color:'#F7F8F7',weight:13,lineCap:'round',lineJoin:'round',opacity}));
    add(L.polyline(l.p.map(i=>rxy(S[i])),
      {color:l.c,weight:6.5,lineCap:'round',lineJoin:'round',opacity}))
      .bindTooltip(l.n,{sticky:true});
  });
  // 往外地的虛線箭頭
  (lay.STUB||[]).forEach(([sid,dx,dy,txt])=>{
    const s=S[sid],on=!hi||rhit(s.n,hi),e={x:s.x+dx*0.5,y:s.y+dy*0.5};
    add(L.polyline([rxy(s),rxy(e)],{color:'#8F8880',weight:2.5,dashArray:'5,4',opacity:on?1:dim}));
    if(on)add(L.marker(rxy(e),{interactive:false,icon:L.divIcon({className:'',iconSize:[0,0],
      iconAnchor:[dx<0?110:(dx===0?55:-10),dy<0?26:-2],
      html:'<div class="rstub">'+txt.split('\n').map(esc).join('<br>')+'</div>'})}));
  });
  // 站點：選定日期時只保留當日站名，避免弱化標籤仍互相遮擋。
  const xs=Object.values(S).map(s=>s.x),minX=Math.min(...xs),maxX=Math.max(...xs);
  Object.entries(S).forEach(([id,s])=>{
    const big=!!s.big,on=!hi||rhit(s.n,hi);
    if(hi&&on)add(L.circleMarker(rxy(s),{radius:big?16:13,color:'#E8873B',weight:2.5,
      fillColor:'#E8873B',fillOpacity:.14}));
    const mk=add(L.circleMarker(rxy(s),{radius:big?8.5:5.5,color:big?'#203848':'#58656D',
      weight:big?3:2,fillColor:'#fff',fillOpacity:on?1:.7,opacity:on?1:.12}));
    const lines=lay.L.concat(lay.DASH||[]).filter(l=>l.p.includes(id)).map(l=>
      '<span style="display:inline-block;border-radius:5px;padding:2px 7px;margin:3px 4px 0 0;'+
      'font-size:10.5px;font-weight:700;color:#fff;background:'+l.c+'">'+esc(l.n)+'</span>').join('');
    const use=RAIL.USE[s.n]||rparts(s.n).map(name=>RAIL.USE[name]).find(Boolean);
    mk.bindPopup('<div class="pop"><b>'+esc(s.n)+'</b>'+
      (s.star?'<div class="ar">★ '+esc(s.star)+'</div>':'')+
      (use?'<div class="ls">'+esc(use)+'</div>':'')+
      (lines?'<div style="margin-top:6px">'+lines+'</div>':'')+'</div>',{maxWidth:250});
    if(!on)return;
    // 地鐵圖總覽只標樞紐與行程重點；選定日期時再顯示當日相關站，避免滿版文字互相遮擋。
    if(!hi&&!big&&!s.star)return;
    let position='';
    if(lay.BELOW.indexOf(id)>=0)position=' btm';
    else if(s.x>=maxX-8)position=' lft';
    else if(s.x>minX+8&&lay.LEFT.indexOf(id)>=0)position=' lft';
    add(L.marker(rxy(s),{interactive:false,
      icon:L.divIcon({className:'',iconSize:[0,0],iconAnchor:[0,8],
        html:'<div class="rlbl '+(big||s.star?'major':'minor')+(s.star?' star':'')+position+'"><b>'+esc(s.n)+'</b></div>'})}));
  });
  renderRailMeta(lay,hi);
  railFit();
  $('#railNote').innerHTML='線名已集中在下方圖例；可雙指縮放、拖曳，點站點看用途與可轉乘路線。'+
    (hi?'<br><b style="color:var(--accent)">橘色光圈＝'+DAYS[+railDay].d.slice(5).replace('-','/')+
      ' 當日站；未使用路線與站點已淡化。</b>':'');
}
const RAILMAXZOOM={osaka:-1.35,kansai:-1.6,kyoto:-1.35};
function railBBox(){
  const S=RAIL.LAYOUTS[railLay].S;
  return L.latLngBounds(Object.values(S).map(rxy));
}
function railFit(){
  railMap.invalidateSize({pan:false});
  railMap.fitBounds(railBBox().pad(.2),{padding:[34,34],maxZoom:RAILMAXZOOM[railLay],animate:false});
}
function railWhole(){
  railMap.fitBounds(railBBox().pad(.32),{padding:[28,28],animate:false});
}

  $('#railDayChips').innerHTML='<button class="chip'+(railDay==='all'?' on plain':'')+

/* ===================== 地圖 ===================== */
const TILES=[
 {n:'Voyager',u:'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
  s:'abcd',a:'&copy; OpenStreetMap &copy; CARTO',max:20},
 {n:'Positron',u:'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  s:'abcd',a:'&copy; OpenStreetMap &copy; CARTO',max:20},
 {n:'OSM',u:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',a:'&copy; OpenStreetMap',max:19},
 {n:'Esri',u:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
  a:'&copy; Esri',max:19}
];
function useTiles(i,manual){
  if(!mapObj)return;
  tileIdx=(i+TILES.length)%TILES.length;
  const t=TILES[tileIdx];
  if(tileLayer)mapObj.removeLayer(tileLayer);
  let loaded=0,failed=0;
  tileLayer=L.tileLayer(t.u,{subdomains:t.s||'abc',maxZoom:t.max,detectRetina:true,
    attribution:t.a,crossOrigin:true}).addTo(mapObj);
  tileLayer.on('load',()=>{$('#tileBadge').style.display='none'});
  tileLayer.on('tileload',()=>{loaded++;$('#tileBadge').style.display='none'});
  tileLayer.on('tileerror',()=>{
    failed++;
    if(loaded===0&&failed>=5&&!manual&&tileIdx<TILES.length-1){useTiles(tileIdx+1)}
    else if(loaded===0&&failed>=5){
      const b=$('#tileBadge');b.textContent='底圖載入失敗，標記仍可使用';b.style.display='block'}
  });
  $('#mapNote').innerHTML='底圖：'+t.n+'　·　數字是當天的行程順序，虛線是動線。'+
    '同一棟樓的店（例如 HEP FIVE 那三家）會合併成一個標記。'+
    '<br>底圖載不出來時可按「換底圖」切換供應商。';
}
function mapPoints(){
  const out=[],seen=new Set();
  const src=mapDay==='all'?DAYS.map((d,i)=>({d,i})):[{d:DAYS[+mapDay],i:+mapDay}];

function gmStopsForDay(di){

    const o=POI[x.o],key=o.lat.toFixed(4)+','+o.lng.toFixed(4);

}

function initMap(){
  if(mapObj){setTimeout(()=>mapObj.invalidateSize(),60);return}
  mapObj=L.map('map',{zoomControl:true,attributionControl:true,tap:false}).setView([34.85,135.6],9);
  useTiles(0);
  drawMarkers();
  mapObj.on('zoomend',renderClusters);
  setTimeout(()=>mapObj.invalidateSize(),120);   /* 容器剛顯示，尺寸要重算 */
  setTimeout(()=>{mapObj.invalidateSize();drawMarkers()},450);

let MG=[],MSEQ=false,MDI=0,polyLayer=null;
function drawMarkers(focus){
  if(!mapObj)return;
  const pts=mapPoints(),byKey={};MG=[];MSEQ=mapDay!=='all';MDI=MSEQ?+mapDay:0;
  pts.forEach(({id,di})=>{
    const o=POI[id];if(!o)return;
    const k=o.lat.toFixed(4)+','+o.lng.toFixed(4);
    if(byKey[k]){byKey[k].list.push(o);return}
    byKey[k]={lat:o.lat,lng:o.lng,di,list:[o]};MG.push(byKey[k]);
  });
  if(polyLayer){mapObj.removeLayer(polyLayer);polyLayer=null}
  if(MSEQ&&MG.length>1)
    polyLayer=L.polyline(MG.map(g=>[g.lat,g.lng]),{color:THC[DAYS[MDI].th]||'#888',
      weight:3.5,opacity:.4,dashArray:'2,9',lineCap:'round'}).addTo(mapObj);
  if(focus)mapObj.setView([focus.lat,focus.lng],16);
  else if(MG.length)mapObj.fitBounds(MG.map(g=>[g.lat,g.lng]),{padding:[42,42],maxZoom:15});
  renderClusters();
}

/* 依目前縮放的螢幕距離把太靠近的標記合成一顆，避免整團疊死 */
function renderClusters(){
  if(!mapObj)return;
  markers.forEach(m=>mapObj.removeLayer(m));markers=[];
  const z=mapObj.getZoom();
  const P=MG.map((g,i)=>({g,i,pt:mapObj.project([g.lat,g.lng],z)}));
  const used=new Array(P.length).fill(false),cl=[];
  for(let i=0;i<P.length;i++){
    if(used[i])continue;used[i]=true;
    const m=[P[i]];
    for(let j=i+1;j<P.length;j++){
      if(used[j])continue;
      if(P[i].pt.distanceTo(P[j].pt)<40){m.push(P[j]);used[j]=true}
    }
    cl.push(m);
  }
  cl.forEach(m=>{
    const first=m[0],c=THC[DAYS[first.g.di].th]||'#888';
    const many=m.length>1;
    const lat=m.reduce((s,x)=>s+x.g.lat,0)/m.length, lng=m.reduce((s,x)=>s+x.g.lng,0)/m.length;
    const label=many?m.length:(MSEQ?first.i+1:(first.g.list[0].p||'·'));
    const sz=many?32:26;
    const ic=L.divIcon({className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],
      html:'<div style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:'+c+
        ';border:'+(many?3:2.5)+'px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);display:flex;'+
        'align-items:center;justify-content:center;color:#fff;font-size:'+(many?12.5:11.5)+
        'px;font-weight:800;font-family:inherit'+
        (many?';outline:4px solid '+c+'33':'')+'">'+label+'</div>'});
    const mk=L.marker([lat,lng],{icon:ic,zIndexOffset:many?900:first.i,riseOnHover:true}).addTo(mapObj);
    if(many){
      mk.bindTooltip(m.length+' 個地點，點一下放大',{direction:'top',offset:[0,-18]});
      mk.on('click',()=>mapObj.fitBounds(m.map(x=>[x.g.lat,x.g.lng]),
        {padding:[70,70],maxZoom:17}));
    }else{
      mk.bindPopup(popHTML(first.g.list,MSEQ?first.i+1:0),{maxWidth:250});
    }
    markers.push(mk);
  });
}

function askGeo(force){
  if(!navigator.geolocation){geoState='no';renderNear();return}
  if(geo&&!force){renderNear();return}
  geoState='ask';renderNear();
  navigator.geolocation.getCurrentPosition(
    p=>{geo={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
      geoState='ok';renderNear();if(mapObj)showMe()},
    e=>{geoState=e.code===1?'deny':'fail';renderNear()},
    {enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}
let meMarker=null;
function showMe(){
  if(!geo||!mapObj)return;

  o.igUrl=VERIFIED_IG_POI[id]||igSearchUrl(o.ja||o.n);

let walkMapObj=null,walkLocateMarker=null;
function walkGoogleLinks(m){
  const stops=m.markers.map(p=>p.name+' 日本');
  const first=m.markers[0],lastRoute=m.routes[m.routes.length-1],lastPoint=lastRoute&&lastRoute.points[lastRoute.points.length-1];
  if(first&&lastPoint&&Math.abs(first.lat-lastPoint[0])<0.0001&&Math.abs(first.lng-lastPoint[1])<0.0001)stops.push(stops[0]);
  const chunks=[];
  for(let i=0;i<stops.length-1;i+=4)chunks.push(stops.slice(i,i+5));
  return chunks.map((chunk,index)=>({
    label:chunks.length>1?'Google Maps 路線 '+(index+1)+'/'+chunks.length:'Google Maps 備援',
    url:'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(chunk[0])+
      '&destination='+encodeURIComponent(chunk[chunk.length-1])+
      (chunk.length>2?'&waypoints='+encodeURIComponent(chunk.slice(1,-1).join('|')):'')+'&travelmode=walking'
  }));
}
function walkMapPanel(di){
  const m=WALK_MAPS[di];if(!m)return'';
  const legend=m.routes.map(r=>'<span><i style="border-color:'+r.color+';border-top-style:'+(r.dash?'dashed':'solid')+'"></i>'+esc(r.name)+'</span>').join('');
  const gmButtons=walkGoogleLinks(m).map(link=>'<a class="btn gm" href="'+link.url+'" target="_blank" rel="noopener">'+link.label+'</a>').join('');
  return '<details class="card walk-card" id="walkDetails-'+di+'"><summary><div><b>'+esc(m.title)+'</b><span>'+esc(m.meta)+'</span></div><em>點開查看</em></summary><div class="walk-tools"><button class="btn" id="walkFit-'+di+'">回到全圖</button><button class="btn" id="walkLocate-'+di+'">◎ 我的位置</button>'+gmButtons+'</div><div class="walk-map" id="walkMap-'+di+'" aria-label="'+esc(m.title)+'"></div><div class="walk-legend">'+legend+'</div><p class="walk-note" id="walkStatus-'+di+'">上方為北；點編號看時間。'+esc(m.note)+'</p></details>';
}
function bindWalkMap(di){
  const d=document.getElementById('walkDetails-'+di);if(!d)return;
  if(walkMapObj){try{walkMapObj.remove()}catch(_){}walkMapObj=null}
  walkLocateMarker=null;
  d.addEventListener('toggle',()=>{if(d.open)setTimeout(()=>initWalkMap(di),80)});
}
function initWalkMap(di){
  const m=WALK_MAPS[di],mount=document.getElementById('walkMap-'+di);
  if(walkMapObj||!m||!mount)return;
  const statusEl=document.getElementById('walkStatus-'+di);
  if(typeof L==='undefined'){statusEl.textContent='地圖元件載入失敗，請改用 Google Maps 備援。';return}
  walkMapObj=L.map(mount,{zoomControl:true,minZoom:13,maxZoom:20,preferCanvas:true});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'&copy; OpenStreetMap contributors'}).addTo(walkMapObj);
  const icon=p=>{
    const large=String(p.seq).includes('/');
    return L.divIcon({className:'walk-marker-wrap',html:'<span class="walk-marker'+(large?' start':'')+(p.optional?' optional':'')+'">'+p.seq+'</span>',iconSize:[large?42:34,large?42:34],iconAnchor:[large?21:17,large?21:17]});
  };
  m.markers.forEach((p,i)=>L.marker([p.lat,p.lng],{icon:icon(p),title:p.name}).addTo(walkMapObj).bindTooltip(p.name,{permanent:true,direction:i%3===1?'left':(i%3===2?'top':'right'),className:'walk-label'}).bindPopup('<b>'+p.seq+' '+esc(p.name)+'</b><br>'+esc(p.time)));
  m.routes.forEach(r=>L.polyline(r.points,{color:r.color,weight:6,opacity:.9,dashArray:r.dash||null,lineJoin:'round'}).addTo(walkMapObj));
  const bounds=L.latLngBounds(m.markers.map(p=>[p.lat,p.lng]));
  const fit=()=>walkMapObj.fitBounds(bounds,{padding:[55,55],maxZoom:17});fit();
  document.getElementById('walkFit-'+di).onclick=fit;
  document.getElementById('walkLocate-'+di).onclick=()=>{
    if(!navigator.geolocation){statusEl.textContent='此瀏覽器不支援定位。';return}
    statusEl.textContent='正在取得目前位置…';
    navigator.geolocation.getCurrentPosition(p=>{
      if(walkLocateMarker)walkMapObj.removeLayer(walkLocateMarker);
      walkLocateMarker=L.circleMarker([p.coords.latitude,p.coords.longitude],{radius:8,color:'#fff',weight:3,fillColor:'#8e24aa',fillOpacity:1}).addTo(walkMapObj).bindTooltip('目前位置',{permanent:true,direction:'right',className:'walk-label'});
      walkMapObj.setView([p.coords.latitude,p.coords.longitude],18);
      statusEl.textContent='已定位；GPS 精度約 ±'+Math.round(p.coords.accuracy)+' 公尺。 '+m.note;
    },()=>statusEl.textContent='未能取得位置，請確認瀏覽器定位權限。',{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
  };
  setTimeout(()=>walkMapObj.invalidateSize(),120);
}

function go(v){
  $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $$('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  window.scrollTo(0,0);
  if(v==='now')renderNow();

    renderMapChips();
    if(mapMode==='rail'){renderRailChips();initRail()}
    else if(mapMode==='geo')initMap();

  }
  if(v==='place'||v==='near'||v==='util'){
    const i=nowInfo().di;setTheme(DAYS[i>=0?i:curDay].th)}

  function enhStatusMap(){

  function enhItemId(di,item){
    return item._enhStableId || (item._enhCustom ? `custom:${item._enhCustom}` : `legacy:${di}:${item.a || ''}:${item.n || ''}`);
  }

  function enhLegacyStatusKey(di,item){
    return item._enhCustom ? `custom:${item._enhCustom}` : `${DAYS[di]?.d || di}|${item.a || ''}|${item.b || ''}|${item.n || ''}`;
  }

  function enhStatusKey(di,item){
    return enhItemId(di,item);
  }

  function enhHasStatusOverride(di,item){
    const map=enhStatusMap();
    return Object.prototype.hasOwnProperty.call(map,enhStatusKey(di,item)) || Object.prototype.hasOwnProperty.call(map,enhLegacyStatusKey(di,item));
  }

  function enhItemStatus(di,item){
    const map = enhStatusMap(), key = enhStatusKey(di,item), legacy = enhLegacyStatusKey(di,item);
    if(Object.prototype.hasOwnProperty.call(map,key)) return map[key];
    if(Object.prototype.hasOwnProperty.call(map,legacy)) return map[legacy];
    return item.status || '未設定';
  }

  function enhSetStatus(di,item,status){
    const map = enhStatusMap(), key = enhStatusKey(di,item), legacy = enhLegacyStatusKey(di,item);
    delete map[legacy];
    if(!status || status === (item.status || '未設定')) delete map[key];
    else map[key] = status;
    enhWrite('status_overrides',map);
  }

  function enhResetStatus(di,item){
    const map = enhStatusMap();
    delete map[enhStatusKey(di,item)];
    delete map[enhLegacyStatusKey(di,item)];
    enhWrite('status_overrides',map);
  }

  function enhApplyStoredRouteOrders(){
    const orders=enhRouteOrders(),times=enhRouteTimes();
    DAYS.forEach((day,di)=>{
      const order=orders[day.d],timeMap=times[day.d]||{};
      if(!Array.isArray(order)||!order.length)return;
      const baseline=day.it.slice(),byId=new Map(baseline.map((item)=>[enhItemId(di,item),item]));
      const orderSet=new Set(order),ordered=order.map((id)=>byId.get(id)).filter(Boolean);let cursor=0;
      day.it=baseline.map((item)=>orderSet.has(enhItemId(di,item))&&cursor<ordered.length?ordered[cursor++]:item);
      day.it.forEach((item)=>{const slot=timeMap[enhItemId(di,item)];if(slot){item.a=slot.a;item.b=slot.b;}});
    });
  }

    });
    Object.keys(POI).filter((id) => id.startsWith('enh_custom_')).forEach((id) => delete POI[id]);
    for(let i=MASTER_PLACES.length-1;i>=0;i--){
      if(MASTER_PLACES[i]._enhCustom) MASTER_PLACES.splice(i,1);
    }

    const custom = enhCustomItems();

  function enhCaptureIndexedState(di){
    const dn=done(),nt=notes(),state={};
    DAYS[di].it.forEach((item,ii)=>{state[enhItemId(di,item)]={done:!!dn[`${di}_${ii}`],note:nt[`${di}_${ii}`]||''};});

  function enhRestoreIndexedState(di,state){
    const dn=done(),nt=notes(),prefix=`${di}_`;
    Object.keys(dn).filter((key)=>key.startsWith(prefix)).forEach((key)=>delete dn[key]);
    Object.keys(nt).filter((key)=>key.startsWith(prefix)).forEach((key)=>delete nt[key]);
    DAYS[di].it.forEach((item,ii)=>{
      const saved=state[enhItemId(di,item)];if(!saved)return;
      if(saved.done)dn[`${di}_${ii}`]=true;
      if(saved.note)nt[`${di}_${ii}`]=saved.note;

  function enhPoiCoord(item){
    const poi=item.o&&POI[item.o];
    return poi&&Number.isFinite(Number(poi.lat))&&Number.isFinite(Number(poi.lng))?{lat:Number(poi.lat),lng:Number(poi.lng),poi}:null;
  }

  function enhKm(a,b){
    if(!a||!b)return 0;
    const rad=(value)=>value*Math.PI/180,dLat=rad(b.lat-a.lat),dLng=rad(b.lng-a.lng);
    const x=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
    return 6371*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
  }

  function enhRouteLocked(di,item){
    const coord=enhPoiCoord(item),status=enhItemStatus(di,item),text=`${item.n||''} ${item.x||''} ${status}`;
    if(/跟團/.test(`${DAYS[di]?.t||''} ${DAYS[di]?.s||''}`))return true;
    if(!coord||coord.poi.pre==='area'||item.k==='transit'||item.k==='food'||coord.poi.kind==='hotel')return true;
    if(/已確認|已訂位|待訂位|待放位/.test(status))return true;
    return /(集合|起飛|飛行|報到|安檢|退稅|退房|入住|check.?in|入園|排隊|整理券|表演|跟團|預約|訂位|班次|開園|閉園|越早|截止|最後入館|日落)/i.test(text);
  }

  function enhPathDistance(items,start,end){
    const points=items.map(enhPoiCoord).filter(Boolean);let total=0,prev=start||null;
    points.forEach((point)=>{if(prev)total+=enhKm(prev,point);prev=point;});
    if(prev&&end)total+=enhKm(prev,end);
    return total;
  }

  function enhBestRouteOrder(items,start,end){
    if(items.length<2)return items.slice();
    let best=items.slice(),bestDistance=enhPathDistance(best,start,end);
    if(items.length<=7){
      const used=Array(items.length).fill(false),path=[];
      const visit=()=>{
        if(path.length===items.length){const distance=enhPathDistance(path,start,end);if(distance<bestDistance){best=path.slice();bestDistance=distance;}return;}
        for(let i=0;i<items.length;i++)if(!used[i]){used[i]=true;path.push(items[i]);visit();path.pop();used[i]=false;}
      };
      visit();
    }else{
      const remaining=items.slice();let cursor=start||enhPoiCoord(remaining[0]);best=[];
      while(remaining.length){let pick=0,score=Infinity;remaining.forEach((item,index)=>{const value=enhKm(cursor,enhPoiCoord(item));if(value<score){score=value;pick=index;}});const [item]=remaining.splice(pick,1);best.push(item);cursor=enhPoiCoord(item);}
      bestDistance=enhPathDistance(best,start,end);
    }
    return best;
  }

  function enhRouteSuggestion(di){
    const original=DAYS[di].it.slice(),result=original.slice(),blocks=[];let flexible=0,locked=0,index=0;
    while(index<original.length){
      if(enhRouteLocked(di,original[index])){locked++;index++;continue;}
      const startIndex=index,block=[];
      while(index<original.length&&!enhRouteLocked(di,original[index])){block.push(original[index]);flexible++;index++;}
      if(block.length<2)continue;
      const previous=startIndex>0?enhPoiCoord(original[startIndex-1]):enhPoiCoord(block[0]);
      const next=index<original.length?enhPoiCoord(original[index]):enhPoiCoord(block[block.length-1]);
      const optimized=enhBestRouteOrder(block,previous,next),before=enhPathDistance(block,previous,next),after=enhPathDistance(optimized,previous,next);
      const changed=optimized.some((item,offset)=>item!==block[offset])&&before-after>=.05;
      if(changed){result.splice(startIndex,block.length,...optimized);blocks.push({startIndex,before,after,from:block,to:optimized});}
    }
    const timeMap={};
    result.forEach((item,slot)=>{timeMap[enhItemId(di,item)]={a:original[slot].a,b:original[slot].b};});
    return {original,items:result,timeMap,blocks,flexible,locked,savedKm:blocks.reduce((sum,block)=>sum+block.before-block.after,0)};
  }

  function enhApplyRouteSuggestion(di,suggestion){
    const state=enhCaptureIndexedState(di),orders=enhRouteOrders(),times=enhRouteTimes(),date=DAYS[di].d;
    orders[date]=suggestion.items.map((item)=>enhItemId(di,item));times[date]=suggestion.timeMap;
    enhWrite('route_orders',orders);enhWrite('route_times',times);enhApplyCustomItems();enhRestoreIndexedState(di,state);
    enhCloseModal();renderChips();renderPlan();enhToast(`D${di+1} 已套用智慧路順，可隨時復原`);
  }

  function enhUndoRouteOrder(di){

  function enhTransitUrl(destination,origin=''){
    const params=new URLSearchParams({api:'1',destination,travelmode:'transit',dir_action:'navigate'});
    if(origin)params.set('origin',origin);
    return `https://www.google.com/maps/dir/?${params.toString()}`;
  }

  function enhTransitTarget(di){
    const day=DAYS[di],info=nowInfo(),dn=done();let start=0;
    if(info.di===di){
      const live=day.it.findIndex((item)=>info.mins>=hm(item.a)&&info.mins<hm(item.b));
      const future=day.it.findIndex((item)=>hm(item.a)>info.mins);
      start=live>=0&&day.it[live].k==='transit'?live:(future>=0?future:Math.max(0,day.it.length-1));
    }
    else{const next=day.it.findIndex((item,ii)=>!dn[`${di}_${ii}`]);start=next<0?0:next;}
    for(let offset=0;offset<day.it.length;offset++){
      const ii=(start+offset)%day.it.length,item=day.it[ii],poi=item.o&&POI[item.o];
      if(poi)return {item,poi,ii};
    }
    return null;
  }

  function enhApplyPlaceVisibility(){
    const container = document.getElementById('placeBody');if(!container) return;

    container.querySelectorAll('.pl').forEach((row) => {
      const no = Number(row.dataset.placeNo);

      const statusOk = enhPlaceStatus === 'all' ||
        (enhPlaceStatus === 'active' && ['必去','已排入'].includes(place.status)) ||
        (enhPlaceStatus === 'pending' && ['待決定','暫不加入','只經過'].includes(place.status)) ||
        (enhPlaceStatus === 'backup' && place.status === '備選') ||
        (enhPlaceStatus === 'favorites' && !!fav[place.no]) ||
        (enhPlaceStatus === 'custom' && place.status === '臨時新增');
      const kindOk = enhPlaceKind === 'all' || place.kind === enhPlaceKind;
      const priorityOk = enhPlacePriority === 'all' || String(masterPriority(place)) === enhPlacePriority;
      row.hidden = !(statusOk && kindOk && priorityOk);if(!row.hidden) visible++;

      if(!star){

    enhAccessify(container);

  function enhExportData(){

    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i);if(key && key.startsWith('kx_')){
        try{payload.data[key]=JSON.parse(localStorage.getItem(key));}catch{payload.data[key]=localStorage.getItem(key);}
      }
    }
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`kansai-trip-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);enhToast('備份檔已匯出');
  }

  function enhImportData(file){

        if(!confirm('匯入會覆蓋這個瀏覽器目前的打勾、筆記、路線選擇、智慧路順、記帳與自訂地點。確定繼續？'))return;

        location.reload();
      }catch{alert('這不是有效的關西行程備份檔。');}
    };reader.readAsText(file);
  }

  }

  function enhToiletLabel(query){
    return query.replace(/公衆トイレ/g,'公共廁所').replace(/トイレ/g,'廁所').replace(/第1ターミナル/g,'第 1 航廈');
  }

  function enhRenderToiletStops(root,dayIndex){
    const target=root.querySelector('[data-enh-toilet-list]'),data=enhToiletStops[dayIndex];
    if(!target||!data)return;
    target.innerHTML=`<div class="enh-toilet-head"><b>D${dayIndex+1} · ${esc(DAYS[dayIndex].d.slice(5).replace('-','/'))}</b><span>${esc(data[0])} · ${data[1].length} 個據點</span></div>${data[1].map((query,index)=>`<a class="enh-toilet-row" href="${enhMapSearch(query)}" target="_blank" rel="noopener" aria-label="在 Google Maps 搜尋 ${esc(enhToiletLabel(query))}"><span>${index+1}</span><b>${esc(enhToiletLabel(query))}</b>${enhIcons.pin}</a>`).join('')}`;
    root.querySelectorAll('[data-enh-toilet-day]').forEach((button)=>button.classList.toggle('on',Number(button.dataset.enhToiletDay)===dayIndex));
  }

  function enhNearbyUtilityPanel(){
    const section=document.createElement('section');section.className='enh-nearby-tools';section.dataset.enhNearbyTools='1';
    const defaultDay=Math.max(0,Math.min(DAYS.length-1,Number(curDay)||0));
    section.innerHTML=`<div class="sec"><i></i><h2>附近快速找</h2></div><div class="enh-quick-grid"><a class="enh-quick-card store" href="${enhMapSearch('コンビニ')}" target="_blank" rel="noopener"><span class="enh-quick-icon">24</span><span><b>附近便利商店</b><small>依目前位置顯示 7-Eleven、FamilyMart、Lawson 等</small></span>${enhIcons.pin}</a><a class="enh-quick-card toilet" href="${enhMapSearch('公衆トイレ')}" target="_blank" rel="noopener"><span class="enh-quick-icon">WC</span><span><b>一鍵找附近廁所</b><small>直接在 Google Maps 顯示距離最近的公廁</small></span>${enhIcons.pin}</a></div><div class="card enh-toilet-card"><div class="enh-toilet-intro"><div><b>行程沿途可靠廁所據點</b><small>優先整理機場、車站、公園、寺社與大型商場；商場與景點須在開放時間內。</small></div><a href="https://plus.kyoto.travel/entry/toilet" target="_blank" rel="noopener">京都官方資料</a></div><div class="enh-place-filters enh-toilet-days" aria-label="選擇日期">${DAYS.map((day,index)=>`<button class="enh-filter ${index===defaultDay?'on':''}" type="button" data-enh-toilet-day="${index}">D${index+1}<small>${day.d.slice(5).replace('-','/')}</small></button>`).join('')}</div><div class="enh-toilet-list" data-enh-toilet-list></div><div class="hint">「附近廁所」適合臨時急用；上方每日清單適合先記住沿途穩定據點。實際開放、整修或入場規則仍以現場為準。</div></div>`;
    enhRenderToiletStops(section,defaultDay);
    section.querySelectorAll('[data-enh-toilet-day]').forEach((button)=>button.onclick=()=>enhRenderToiletStops(section,Number(button.dataset.enhToiletDay)));
    return section;
  }

  function enhExpenseOverviewPanel(){
    const totals=enhExpenseTotals(),rate=Number(enhRead('rate',.21))||.21,maxDay=Math.max(1,...totals.byDay);
    const section=document.createElement('section');section.className='enh-ledger-tools';section.dataset.enhLedgerTools='1';
    const days=totals.byDay.map((amount,di)=>`<button type="button" class="enh-ledger-day" data-enh-ledger-day="${di}"><span>D${di+1}<small>${DAYS[di].d.slice(5).replace('-','/')}</small></span><i><b style="width:${amount/maxDay*100}%"></b></i><strong>${enhFmtYen(amount)}</strong></button>`).join('');
    const categories=Object.entries(totals.byCategory).sort((a,b)=>b[1]-a[1]).map(([category,amount])=>`<div><span>${esc(category)}</span><b>${enhFmtYen(amount)}</b></div>`).join('');
    section.innerHTML=`<div class="sec"><i></i><h2>旅費記帳總覽</h2><span class="cnt">${totals.rows.length} 筆</span></div><div class="card enh-ledger-card"><div class="enh-ledger-hero"><div><small>TRIP SPEND · JPY</small><b>${enhFmtYen(totals.total)}</b><span>約 NT$ ${Math.round(totals.total*rate).toLocaleString('zh-TW')}（依工具頁匯率 ${rate}）</span></div>${enhIcons.yen}</div>${totals.rows.length?`<div class="enh-ledger-days">${days}</div><div class="enh-ledger-categories">${categories}</div>`:'<div class="enh-empty">尚未記帳。到「行程」展開任一節點，直接輸入日圓金額即可。</div>'}<div class="enh-ledger-actions"><button class="btn" type="button" data-enh-ledger-plan>回行程新增金額</button><button class="btn" type="button" data-enh-ledger-clear ${totals.rows.length?'':'disabled'}>清除全部記帳</button></div></div>`;
    section.querySelectorAll('[data-enh-ledger-day]').forEach((button)=>button.onclick=()=>{curDay=Number(button.dataset.enhLedgerDay);go('plan');window.scrollTo({top:0,behavior:'smooth'});});
    section.querySelector('[data-enh-ledger-plan]').onclick=()=>go('plan');
    section.querySelector('[data-enh-ledger-clear]').onclick=()=>{if(confirm('確定清除全部行程記帳？這不會刪除行程、筆記或打勾。')){enhWrite('expenses',{});renderUtil();enhToast('已清除全部記帳');}};
    return section;
  }

  function enhPdfUtilityPanel(){
    const section=document.createElement('section');section.className='enh-pdf-tools';section.dataset.enhPdfTools='1';
    section.innerHTML=`<div class="sec"><i></i><h2>離線行程手冊</h2></div><div class="card enh-pdf-card">${enhIcons.pdf}<div><b>匯出行程 PDF</b><small>輸出完整 9 天或目前單日，包含時間軸、交通、住宿、提醒，以及你選擇加入的筆記與記帳。</small></div><button class="btn pri" type="button" data-enh-open-pdf>選擇並匯出</button></div>`;
    section.querySelector('[data-enh-open-pdf]').onclick=enhOpenPdfExport;return section;
  }

  function enhEnhanceUtil(){
    const body=document.getElementById('utilBody');if(!body)return;
    body.prepend(enhNearbyUtilityPanel());
    body.prepend(enhPdfUtilityPanel());
    body.prepend(enhExpenseOverviewPanel());
    const wrongHint=[...body.querySelectorAll('.hint')].find((node)=>node.textContent.includes('範圍：心齋橋'));
    if(wrongHint)wrongHint.textContent='住宿位置：惠美須西 3-14-13；近動物園前／JR・南海新今宮。';
    if(!body.querySelector('[data-enh-backup]')){
      const section=document.createElement('div');section.dataset.enhBackup='1';section.className='card';
      section.innerHTML=`<div class="b sm">資料備份與移轉</div><div class="hint">包含打勾、筆記、A/B 路線、智慧路順、記帳、住宿地址、匯率、收藏與臨時行程。換手機前先匯出。</div><div class="enh-backup"><button class="btn" type="button" data-enh-export>匯出 JSON 備份</button><button class="btn" type="button" data-enh-import>匯入備份</button><input type="file" accept="application/json,.json" hidden data-enh-import-file></div>`;
      body.insertAdjacentHTML('beforeend','<div class="sec"><i></i><h2>備份與資料完整性</h2></div>');body.appendChild(section);
      const audit=document.createElement('div');audit.className='card';audit.innerHTML=`<div class="b sm">新版回歸檢查摘要</div><div class="enh-system-list">${enhSystemChecks()}</div>`;body.appendChild(audit);
      const input=section.querySelector('[data-enh-import-file]');
      section.querySelector('[data-enh-export]').onclick=enhExportData;
      section.querySelector('[data-enh-import]').onclick=()=>input.click();
      input.onchange=()=>{if(input.files&&input.files[0])enhImportData(input.files[0]);};
    }
    enhAccessify(body);
  }

  function enhAccessify(root=document){
    root.querySelectorAll('a[target="_blank"]').forEach((link)=>{if(!link.rel.includes('noopener'))link.rel=`${link.rel} noopener`.trim();});
    root.querySelectorAll('.iconbtn').forEach((button)=>{if(!button.getAttribute('aria-label'))button.setAttribute('aria-label',button.title||'開啟快捷功能');});
    root.querySelectorAll('[data-tog]').forEach((toggle)=>{
      if(toggle.dataset.enhA11y)return;toggle.dataset.enhA11y='1';toggle.setAttribute('role','button');toggle.tabIndex=0;
      toggle.setAttribute('aria-expanded',String(toggle.closest('.it')?.classList.contains('open')));
      toggle.addEventListener('click',()=>setTimeout(()=>toggle.setAttribute('aria-expanded',String(toggle.closest('.it')?.classList.contains('open'))),0));
      toggle.addEventListener('keydown',(event)=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();toggle.click();}});
    });
    root.querySelectorAll('[data-ck]').forEach((check)=>{
      if(check.dataset.enhA11y)return;check.dataset.enhA11y='1';check.setAttribute('role','checkbox');check.tabIndex=0;
      const sync=()=>check.setAttribute('aria-checked',String(check.closest('.it')?.classList.contains('done')));sync();
      check.addEventListener('click',()=>setTimeout(sync,0));check.addEventListener('keydown',(event)=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();check.click();}});
    });
  }

  function enhEnsureChrome(){
    document.body.dataset.enhTheme=enhRead('enh_theme','');document.body.dataset.enhFont=enhRead('enh_font','');
    const header=document.querySelector('.top');
    if(header && !header.querySelector('.enh-header-actions')){
      const actions=document.createElement('div');actions.className='enh-header-actions';
      actions.innerHTML=`<button class="enh-head-btn" type="button" data-enh="search" aria-label="全域搜尋" title="全域搜尋">${enhIcons.search}<span class="enh-label">搜尋</span><i class="enh-online-dot ${navigator.onLine?'':'off'}"></i></button><button class="enh-head-btn" type="button" data-enh="add" aria-label="新增臨時行程或地點" title="新增">${enhIcons.plus}<span class="enh-label">新增</span></button><button class="enh-head-btn" type="button" data-enh="settings" aria-label="顯示與偏好" title="顯示與偏好">${enhIcons.tune}<span class="enh-label">顯示</span></button>`;
      header.insertBefore(actions,document.getElementById('dcount'));
      actions.querySelector('[data-enh="search"]').onclick=enhOpenSearch;
      actions.querySelector('[data-enh="add"]').onclick=()=>enhOpenAdd('event');
      actions.querySelector('[data-enh="settings"]').onclick=enhOpenSettings;
    }
    const nav=document.getElementById('nav');if(nav){nav.setAttribute('aria-label','主要導覽');}
    document.querySelectorAll('.view').forEach((view)=>{view.setAttribute('role','main');view.setAttribute('aria-hidden',String(!view.classList.contains('on')));});
    const updateNet=()=>{const dot=document.querySelector('.enh-online-dot');if(dot)dot.classList.toggle('off',!navigator.onLine);};
    window.addEventListener('online',updateNet);window.addEventListener('offline',updateNet);
    enhAccessify(document);
  }

  enhFixSourceData();
  enhMigrateLegacyStatusKeys();
  enhApplyCustomItems();

  const enhBaseRenderNow=renderNow;
  renderNow=function(){enhBaseRenderNow();enhEnhanceNow();};
  const enhBaseRenderPlan=renderPlan;
  renderPlan=function(){enhBaseRenderPlan();enhEnhancePlan();};
  const enhBaseRenderPlaces=renderPlaces;
  renderPlaces=function(){enhBaseRenderPlaces();enhEnsurePlaceFilters();enhApplyPlaceVisibility();};
  const enhBaseRenderUtil=renderUtil;
  renderUtil=function(){enhBaseRenderUtil();enhEnhanceUtil();};
  const enhBaseGo=go;
  go=function(view){enhBaseGo(view);document.querySelectorAll('.view').forEach((section)=>section.setAttribute('aria-hidden',String(section.id!==`v-${view}`)));document.querySelectorAll('#nav button').forEach((button)=>button.setAttribute('aria-current',button.dataset.v===view?'page':'false'));};

  enhEnsureChrome();
  renderNow();
  renderChips();
  renderMapChips();
  renderAreaChips();
  renderPChips();
})();

</script>
</body>
</html>
