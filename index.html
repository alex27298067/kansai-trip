  border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.13),transparent 68%)}
.hero.live{background:linear-gradient(140deg,#9C3D28 0%,#C05C32 55%,#D7853E 100%);
  box-shadow:0 10px 28px -14px rgba(156,61,40,.72)}
.hero.gap{background:linear-gradient(140deg,#3D4148 0%,#575D66 55%,#6E7681 100%);
  box-shadow:0 10px 28px -14px rgba(61,65,72,.66)}
.hero .lbl{font-size:10px;letter-spacing:2px;opacity:.85;font-weight:800;
  display:flex;align-items:center;gap:7px;position:relative}
.hero .big{font-size:23px;font-weight:800;margin-top:7px;line-height:1.35;position:relative;letter-spacing:.3px}
.hero .meta{font-size:11.5px;opacity:.88;margin-top:8px;position:relative;line-height:1.7}
.hero .prgline{position:relative;margin-top:12px;height:5px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.hero .prgline i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .5s ease}
.ldot{width:7px;height:7px;border-radius:50%;background:#8BEF9C;display:inline-block;
  box-shadow:0 0 0 3px rgba(139,239,156,.28);animation:bl 1.8s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
.cd{display:flex;gap:7px;margin-top:14px;position:relative}
.cd div{flex:1;background:rgba(255,255,255,.13);border-radius:12px;padding:9px 3px;text-align:center;
  border:1px solid rgba(255,255,255,.1)}
.cd b{display:block;font-size:18px;font-weight:800;line-height:1.2}
.cd span{font-size:9px;opacity:.82;letter-spacing:.3px}
.hero .btns{margin-top:13px;position:relative}
.hero .btn{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.22)}
.hero .btn.gm{background:#fff;color:#1A3E6E;border-color:transparent}
.spanbar{position:relative;margin-top:11px;border-radius:12px;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.16);padding:9px 11px;font-size:11px;line-height:1.6;
  display:flex;gap:8px;align-items:flex-start}
.spanbar b{font-weight:800}
.spanbar svg{width:13px;height:13px;flex:0 0 13px;margin-top:3px;opacity:.85}

/* ============ timeline ============ */
.tl{position:relative;padding-left:64px}
.tl:before{content:"";position:absolute;left:64px;top:14px;bottom:20px;width:2px;
  background:linear-gradient(180deg,var(--line) 0%,var(--line) 88%,transparent 100%);border-radius:2px}
.it{position:relative;margin-bottom:9px}
.it .tm{position:absolute;left:-64px;top:12px;width:46px;text-align:right;line-height:1.35}
.it .tm b{display:block;font-size:11.5px;font-weight:800;color:var(--day);letter-spacing:-.2px}
.it .tm span{display:block;font-size:9.5px;color:var(--muted);font-weight:600}
.it .nd{position:absolute;left:-12px;top:18px;width:12px;height:12px;border-radius:50%;
  background:var(--card);border:2.5px solid var(--line);z-index:2;transition:all .2s}
.it.p1 .nd{border-color:var(--p1)} .it.p2 .nd{border-color:var(--p2)} .it.p3 .nd{border-color:var(--p3)}
.it.done .nd{background:var(--p2);border-color:var(--p2)}
.it.live .nd{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 5px var(--accentT)}
.ic{background:var(--card);border-radius:15px;padding:11px 12px;box-shadow:var(--sh);
  transition:box-shadow .2s,opacity .2s}
.it.live .ic{box-shadow:0 0 0 1.5px var(--accent),0 6px 18px -8px rgba(217,129,47,.5)}
.it.done .ic{opacity:.52;box-shadow:var(--shL)}
.it.span .ic{border-left:3px solid var(--day)}
.it.mine .ic{border:1px dashed var(--info)}
.ic .hd{display:flex;align-items:flex-start;gap:9px;cursor:pointer}
.ic .ttl{flex:1;min-width:0;font-size:13.8px;font-weight:700;line-height:1.5;letter-spacing:.1px}
.it.done .ttl{text-decoration:line-through}
.ic .ar{font-size:10.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:4px;
  font-weight:600;line-height:1.5}
.ic .ar svg{width:11px;height:11px;flex:0 0 11px;opacity:.65}
.ic .flags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.cb{flex:0 0 22px;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);
  background:var(--card);display:flex;align-items:center;justify-content:center;margin-top:2px;
  transition:all .18s;position:relative}
.cb:before{content:"";position:absolute;left:-11px;right:-11px;top:-11px;bottom:-11px}
.cb svg{width:12px;height:12px;stroke:#fff;opacity:0;transition:opacity .15s}
.it.done .cb,.ck.on .cb{background:var(--p2);border-color:var(--p2)}
.it.done .cb svg,.ck.on .cb svg{opacity:1}
.kico{flex:0 0 auto;width:18px;height:18px;margin-top:2px;opacity:.5;color:var(--ink2)}
.chev{flex:0 0 auto;width:16px;height:16px;color:var(--muted);margin-top:3px;transition:transform .2s}
.it.open .chev{transform:rotate(180deg)}
.det{display:none;margin-top:11px;padding-top:11px;border-top:1px solid var(--line2)}
.it.open .det{display:block}
.kv{font-size:11.8px;color:var(--ink2);line-height:1.75;background:var(--sunk);
  border-radius:10px;padding:8px 10px;margin-bottom:7px}
.kv b{color:var(--ink)}
.kv.warn{background:var(--warnT);color:var(--warn)}
.kv.warn b{color:var(--warn)}
.note{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 11px;
  font-size:12.5px;background:var(--sunk);resize:vertical;min-height:56px;margin-top:9px;line-height:1.65}
.note:focus{outline:none;border-color:var(--accent);background:var(--card);
  box-shadow:0 0 0 3px var(--accentT)}
.gapmark{position:relative;margin:0 0 9px;padding:6px 11px;border-radius:10px;
  background:var(--sunk);border:1px dashed var(--line);font-size:10.5px;color:var(--muted);
  font-weight:700;display:flex;align-items:center;gap:6px}
.gapmark svg{width:12px;height:12px;flex:0 0 12px}
.nowline{position:relative;margin:0 0 9px;height:0;border-top:2px dashed var(--accent);opacity:.9}
.nowline:before{content:attr(data-t);position:absolute;left:-64px;top:-9px;font-size:9.5px;
  font-weight:800;color:var(--accent);background:var(--bg);padding:0 3px}
.nowline:after{content:"";position:absolute;left:-13px;top:-4px;width:8px;height:8px;
  border-radius:50%;background:var(--accent)}

/* ============ day header ============ */
.dayhd{background:var(--card);border-radius:18px;padding:15px 16px;margin-bottom:14px;
  box-shadow:var(--sh);position:relative;overflow:hidden}
.dayhd:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--day)}
.dayhd .no{font-size:10px;font-weight:800;letter-spacing:1.3px;color:var(--day)}
.dayhd .t{font-size:18.5px;font-weight:800;margin-top:5px;line-height:1.35;letter-spacing:.3px}
.dayhd .s{font-size:11.8px;color:var(--muted);margin-top:6px;line-height:1.7}
.prg{display:flex;align-items:center;gap:10px;margin-top:12px}
.bar{flex:1;height:6px;background:var(--line2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--p2);border-radius:99px;transition:width .35s ease}
.prg span{font-size:10.5px;color:var(--muted);font-weight:700;flex:0 0 auto}
.dayacts{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.dayacts button{flex:1 1 0;min-width:96px;min-height:40px;border-radius:11px;border:1px solid var(--line);
  background:var(--sunk);font-size:11.5px;font-weight:700;display:flex;align-items:center;
  justify-content:center;gap:5px;color:var(--ink2)}
.dayacts button svg{width:14px;height:14px}
.dayacts button.acc{background:var(--dayT);color:var(--day);border-color:transparent}

/* ============ brief / audit ============ */
.todaybrief{border-radius:17px;background:var(--card);border:1px solid var(--line);
  padding:13px 14px;margin:0 0 11px;box-shadow:var(--sh)}
.briefhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.briefhead .ey{font-size:9.5px;font-weight:800;letter-spacing:1.2px;color:var(--day)}
.briefhead h3{font-size:15.5px;line-height:1.4;margin-top:2px}
.briefdate{flex:0 0 auto;background:var(--dayT);color:var(--day);border-radius:9px;padding:5px 8px;
  font-size:10px;font-weight:800}
.briefgrid{display:grid;grid-template-columns:1fr;gap:8px}
.briefsec{border:1px solid var(--line2);border-radius:12px;background:var(--sunk);padding:9px 10px}
.briefsec h4{font-size:9.5px;letter-spacing:.8px;color:var(--muted);margin-bottom:6px;font-weight:800}
.briefline{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px;padding:4px 0;
  border-bottom:1px dashed var(--line2);font-size:10.8px;line-height:1.55;color:var(--ink2)}
.briefline:last-child{border:none;padding-bottom:0}
.briefline b{color:var(--day);font-size:10px}
.briefalerts{margin-top:8px;border-radius:12px;background:var(--warnT);border:1px solid var(--warnLine);padding:8px 10px}
.briefalert{position:relative;padding-left:14px;font-size:10.8px;color:var(--warn);line-height:1.6;margin:2px 0}
.briefalert:before{content:"!";position:absolute;left:0;top:1px;font-size:9px;font-weight:900}
.auditcard{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 13px;
  margin-bottom:12px;box-shadow:var(--shL)}
.auditcard .ah{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.auditcard .ah h3{font-size:11.8px;letter-spacing:.5px}
.auditcard .ah span{font-size:8.8px;color:var(--muted);font-weight:700}
.auditrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:8px;align-items:start;
  padding:8px 0;border-top:1px solid var(--line2);font-size:10.8px;line-height:1.55;color:var(--ink2)}
.auditstate{border-radius:99px;padding:3px 5px;text-align:center;font-size:8.6px;font-weight:800}
.auditstate.ok{background:var(--okT);color:var(--ok)}
.auditstate.warn{background:var(--warnT);color:var(--warn)}
.auditstate.check{background:var(--infoT);color:var(--info)}
.auditrow a{font-size:9.5px;color:var(--gmInk);font-weight:800;white-space:nowrap}

/* ============ A/B decisions ============ */
.decisiondeck{margin:0 0 13px;border:1px solid var(--line);border-radius:18px;background:var(--card);
  box-shadow:var(--sh);overflow:hidden}
.decisiontop{padding:12px 13px 10px;background:linear-gradient(135deg,#142D43,#244D68);color:#fff}
.decisiontop .ey{font-size:9px;letter-spacing:1.1px;font-weight:800;color:#AED6ED}
.decisiontop h3{font-size:14.5px;line-height:1.4;margin-top:2px}
.decisiontop p{font-size:10px;line-height:1.55;color:#D7E6EF;margin-top:4px}
.decisiontabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:10px 10px 0}
.decisiontab{border:1px solid var(--line);border-radius:12px;background:var(--sunk);padding:9px 10px;
  text-align:left;color:var(--ink2);min-height:46px}
.decisiontab b{display:block;font-size:11.5px;line-height:1.35}
.decisiontab span{display:block;font-size:9px;color:var(--muted);margin-top:3px}
.decisiontab.on{border-color:var(--day);background:var(--dayT);color:var(--day);box-shadow:inset 0 0 0 1px var(--day)}
.decisiontab.on span{color:var(--day);opacity:.8}
.decisionpanel{padding:10px 12px 12px}
.decisionbadge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;
  background:var(--infoT);color:var(--info);padding:4px 8px;font-size:9px;font-weight:800;margin-bottom:8px}
.decisionmetrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:9px}
.decisionmetric{border:1px solid var(--line2);border-radius:10px;background:var(--sunk);padding:6px 7px;min-width:0}
.decisionmetric span{display:block;font-size:8px;color:var(--muted);font-weight:800}
.decisionmetric b{display:block;font-size:10.5px;line-height:1.35;margin-top:2px}
.decisionsteps{border-left:2px solid var(--day);margin:2px 0 9px 5px;padding-left:11px}
.decisionstep{position:relative;font-size:10.5px;line-height:1.55;color:var(--ink2);padding:3px 0}
.decisionstep:before{content:"";position:absolute;width:6px;height:6px;border:2px solid var(--day);
  background:var(--card);border-radius:50%;left:-16px;top:8px}
.decisionresult{border-radius:11px;background:var(--okT);border:1px solid var(--okLine);padding:8px 10px;
  color:var(--ok);font-size:10.5px;line-height:1.6;margin:7px 0}
.decisionresult b{display:block;font-size:9px;letter-spacing:.6px;margin-bottom:2px}
.decisionwhen,.decisionnote{font-size:10px;line-height:1.6;color:var(--ink2);padding:5px 1px}
.decisionnote{color:var(--warn)}
.decisionwhen b,.decisionnote b{color:var(--ink);margin-right:4px}
.decisionnote b{color:var(--warn)}
.decisionactions{display:flex;gap:7px;margin-top:8px}
.decisionactions a{flex:1;text-align:center;border-radius:10px;padding:10px 8px;font-size:10.5px;
  font-weight:800;min-height:42px;display:flex;align-items:center;justify-content:center}
.decisionactions .mapa{background:var(--gm);color:#fff}
.decisionactions .srca{background:var(--sunk);color:var(--ink2);border:1px solid var(--line)}
.decisionstamp{text-align:right;font-size:8px;color:var(--muted);padding:0 12px 9px}
.cmp{margin:2px 10px 10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cmp summary{list-style:none;padding:9px 11px;font-size:11px;font-weight:800;color:var(--ink2);
  background:var(--sunk);cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.cmp summary::-webkit-details-marker{display:none}
.cmptab{width:100%;border-collapse:collapse;font-size:10.2px}
.cmptab th,.cmptab td{padding:7px 9px;border-top:1px solid var(--line2);text-align:left;vertical-align:top}
.cmptab th{color:var(--muted);font-weight:800;width:56px}
.cmptab td{color:var(--ink2)}
.cmptab td.pick{color:var(--day);font-weight:800}

/* ============ transit strip ============ */
.route{background:var(--card);border-radius:14px;padding:11px 12px;margin-bottom:11px;box-shadow:var(--sh)}
.route .rh{font-size:10px;font-weight:800;letter-spacing:1.1px;color:var(--muted);margin-bottom:9px}
.legs{display:flex;flex-wrap:wrap;align-items:center;gap:5px 3px}
.legs .st{background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:4px 7px;
  font-size:10.5px;font-weight:800;white-space:nowrap}
.legs .ln{min-width:92px;flex:1 1 92px;text-align:center;padding:0 2px}
.legs .ln .bar{height:4px;border-radius:3px;margin-bottom:3px}
.legs .ln .lb{font-size:9.8px;font-weight:700;color:var(--ink2);line-height:1.3}
.legs .ln .mn{font-size:9.5px;color:var(--muted)}
.legs .ln .nt{font-size:8.8px;color:var(--warn);line-height:1.3;margin-top:2px}
.legs .gap{flex-basis:100%;height:5px}

/* ============ maps ============ */
.mapbox{position:relative;z-index:0;isolation:isolate;border-radius:16px;overflow:hidden;
  box-shadow:var(--sh);background:var(--tile)}
#map{height:430px;height:clamp(300px,56dvh,540px);width:100%}
.leaflet-container{font:inherit!important;background:var(--tile)}
.leaflet-control-zoom a{border-radius:9px!important;color:#1B2025!important;border:none!important;
  box-shadow:var(--shL);background:#fff!important}
.leaflet-control-attribution{font-size:8.5px!important;background:rgba(255,255,255,.72)!important;
  padding:0 4px!important;line-height:1.5!important;color:#333!important}
.leaflet-control-attribution a{color:#0645ad!important}
.leaflet-bottom{z-index:400!important}
.leaflet-popup-content-wrapper{border-radius:13px!important;box-shadow:var(--shPop)!important;
  background:var(--card)!important;color:var(--ink)!important}
.leaflet-popup-tip{background:var(--card)!important}
.leaflet-popup-content{margin:12px 14px!important;font:inherit!important;line-height:1.6!important}
.leaflet-popup-close-button{color:var(--muted)!important}
.pop b{font-size:13.5px;display:block;margin-bottom:4px;letter-spacing:.2px;color:var(--ink)}
.pop .ar{font-size:10.5px;color:var(--muted);margin-bottom:6px}
.pop .ls{font-size:11.5px;color:var(--ink2);line-height:1.75}
.pop .acts{display:flex;gap:6px;margin-top:9px}
.pop .acts a{flex:1;text-align:center;background:var(--gm);color:#fff;padding:8px;
  border-radius:9px;font-size:11.5px;font-weight:700}
.pop .acts a.alt{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.mnote{font-size:10.8px;color:var(--muted);line-height:1.75;margin-top:10px}
.tilebadge{position:absolute;left:9px;bottom:9px;z-index:500;background:rgba(255,255,255,.92);
  border-radius:8px;padding:4px 8px;font-size:9.5px;color:#6b6357;font-weight:700;
  box-shadow:var(--shL);display:none;max-width:70%;line-height:1.5}
.gmhero{background:var(--gmT);border:1px solid var(--gmLine);border-radius:16px;padding:14px 15px;
  margin-bottom:11px;box-shadow:var(--sh)}
.gmhero .eyebrow{font-size:10px;font-weight:800;letter-spacing:1.1px;color:var(--gmInk)}
.gmhero h3{font-size:16.5px;line-height:1.45;margin-top:5px;letter-spacing:.2px}
.gmhero p{font-size:11.5px;color:var(--ink2);line-height:1.75;margin-top:5px}
.gmroute{background:var(--card);border-radius:15px;padding:12px 13px;margin-bottom:10px;box-shadow:var(--sh)}
.gmroute .topline{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.gmroute .rt{font-size:13.5px;font-weight:800;line-height:1.45}
.gmroute .rs{font-size:10.5px;color:var(--muted);line-height:1.55;margin-top:3px}
.gmroute .openroute{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
  margin-top:10px;padding:11px 12px;border-radius:11px;background:var(--gm);color:#fff;
  font-size:12.5px;font-weight:800;min-height:44px}
.gmroute .openroute svg{width:16px;height:16px}
.gmroute .openroute+.openroute{margin-top:7px}
.gmstops{background:var(--card);border-radius:15px;padding:2px 12px;margin-top:11px;box-shadow:var(--sh)}
.gmstop{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.gmstop:last-child{border-bottom:none}
.gmstop .num{width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;background:var(--day);color:#fff;font-size:10.5px;font-weight:800}
.gmstop .mid{min-width:0;flex:1}
.gmstop .time{font-size:9.5px;color:var(--day);font-weight:800;letter-spacing:.3px}
.gmstop .name{font-size:12.8px;font-weight:700;line-height:1.45;margin-top:1px}
.gmstop .area{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.5}
.gmstop .acts{display:flex;gap:6px;flex:0 0 auto}
.gmstop .acts a{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;background:var(--gmT);color:var(--gmInk);border:1px solid var(--gmLine)}
.gmstop .acts a.navto{background:var(--sunk);color:var(--ink2);border-color:var(--line)}
.gmstop .acts svg{width:16px;height:16px}
.gmall{display:grid;grid-template-columns:1fr;gap:9px}
.gmall .gmroute{margin:0}

/* ============ segmented / rail ============ */
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:13px;
  padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;font-size:12.5px;font-weight:700;
  color:var(--muted);min-height:42px}
.seg button.on{background:var(--card);color:var(--day);box-shadow:var(--shL)}
.seg.sm2 button{padding:8px 3px;font-size:11.5px}
#railmap{height:430px;height:clamp(360px,56dvh,560px);width:100%;background:transparent}
.railhead{position:relative;overflow:hidden;border-radius:17px;margin-bottom:11px;padding:16px 17px;
  color:#fff;background:linear-gradient(135deg,#172B47 0%,#224B72 62%,#2E6A88 100%);
  box-shadow:0 14px 30px -20px rgba(14,38,66,.85)}
.railhead:after{content:"";position:absolute;right:-38px;top:-58px;width:155px;height:155px;
  border:25px solid rgba(255,255,255,.07);border-radius:50%}
.railhead .rey{position:relative;z-index:1;font-size:9.5px;font-weight:800;letter-spacing:1.6px;color:#A9D8EC}
.railhead h3{position:relative;z-index:1;font-size:19px;line-height:1.35;margin-top:5px;letter-spacing:.3px}
.railhead p{position:relative;z-index:1;font-size:10.8px;line-height:1.65;margin-top:5px;color:#D8E6F1}
.railstats{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.railstat{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.09);border-radius:99px;padding:5px 9px;font-size:9.5px;font-weight:700}
.railstat b{font-size:11px;color:#fff}
.railbox{border:1px solid #D9E0E5;background-color:#F6F7F5;
  background-image:linear-gradient(rgba(31,68,96,.035) 1px,transparent 1px),
  linear-gradient(90deg,rgba(31,68,96,.035) 1px,transparent 1px),
  radial-gradient(circle at 75% 18%,rgba(83,151,180,.10),transparent 36%),
  radial-gradient(circle at 15% 78%,rgba(217,129,47,.08),transparent 34%);
  background-size:22px 22px,22px 22px,100% 100%,100% 100%;
  box-shadow:0 16px 34px -24px rgba(24,49,71,.8)}
.rlbl{display:inline-flex;flex-direction:column;gap:1px;max-width:132px;padding:4px 7px;
  border:1px solid rgba(40,55,66,.12);border-radius:7px;background:rgba(255,255,255,.95);
  box-shadow:0 3px 9px rgba(28,42,52,.12);font-size:10px;color:#1B2B37;white-space:nowrap;
  pointer-events:none;line-height:1.2}
.rlbl b{font-size:10.5px;font-weight:800}
.rlbl small{font-size:8.5px;font-weight:650;color:#78838B}
.rlbl.lft{transform:translateX(-100%);margin-left:-22px}
.rlbl.btm{transform:translate(-50%,17px);margin-left:-13px}
.rlbl.dimmed{opacity:.32}
.rline{padding:3px 7px;border-radius:99px;background:rgba(255,255,255,.96);border:1px solid currentColor;
  box-shadow:0 2px 7px rgba(28,42,52,.10);font-size:9.5px;font-weight:800;white-space:nowrap;pointer-events:none}
.rstub{padding:4px 7px;border-radius:7px;background:rgba(255,255,255,.93);border:1px dashed #B4B9BC;
  box-shadow:0 2px 7px rgba(28,42,52,.08);font-size:9px;font-weight:700;color:#5E6870;
  white-space:nowrap;line-height:1.45;pointer-events:none}
.rlbl.big b{font-size:11.5px}
.rlbl.star{border-color:#D99062;background:#FFF8F1}
.rlbl.star b{color:#A34C2F}
.raillegend{display:flex;flex-wrap:wrap;gap:7px;margin:10px 1px 2px}
.railli{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);
  border-radius:99px;padding:5px 8px 5px 6px;font-size:9.5px;font-weight:700;color:var(--ink2)}
.railli i{display:block;width:18px;height:5px;border-radius:99px}
.railli.walk i{height:0;border-top:2px dashed #9EA5A8;border-radius:0}


/* 路網示意圖：深色版（站名、線名、標籤都要一起換，不能只換底） */
:root[data-theme="dark"]{--railpaper-dark:1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--railpaper-dark:1}}
:root[data-theme="dark"] .railbox,
:root[data-theme="dark"] .walk-map{background-color:#171C22;
  background-image:linear-gradient(rgba(150,180,205,.05) 1px,transparent 1px),
  linear-gradient(90deg,rgba(150,180,205,.05) 1px,transparent 1px),
  radial-gradient(circle at 75% 18%,rgba(83,151,180,.12),transparent 36%),
  radial-gradient(circle at 15% 78%,rgba(233,151,74,.09),transparent 34%);
  border-color:#2C333B}
:root[data-theme="dark"] .rlbl{background:rgba(31,37,44,.95);border-color:rgba(160,185,205,.2);
  color:#DDE4EA;box-shadow:0 3px 9px rgba(0,0,0,.5)}
:root[data-theme="dark"] .rlbl small{color:#8FA0AD}
:root[data-theme="dark"] .rlbl.star{border-color:#B4653F;background:#33241C}
:root[data-theme="dark"] .rlbl.star b{color:#EFA57F}
:root[data-theme="dark"] .rline{background:rgba(24,29,35,.96);box-shadow:0 2px 7px rgba(0,0,0,.5)}
:root[data-theme="dark"] .rstub{background:rgba(28,34,41,.94);border-color:#4A555F;color:#A9B5BF}
:root[data-theme="dark"] .walk-label{background:rgba(31,37,44,.95)!important;
  border-color:rgba(160,185,205,.22)!important;color:#DDE4EA!important;
  box-shadow:0 2px 6px rgba(0,0,0,.5)!important}
:root[data-theme="dark"] .leaflet-control-zoom a{background:#232830!important;color:#E4E9EE!important}
:root[data-theme="dark"] .leaflet-control-attribution{background:rgba(20,24,29,.75)!important;color:#98A2AC!important}
:root[data-theme="dark"] .leaflet-control-attribution a{color:#7FB0F0!important}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .railbox,
  :root:not([data-theme="light"]) .walk-map{background-color:#171C22;
    background-image:linear-gradient(rgba(150,180,205,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(150,180,205,.05) 1px,transparent 1px),
    radial-gradient(circle at 75% 18%,rgba(83,151,180,.12),transparent 36%),
    radial-gradient(circle at 15% 78%,rgba(233,151,74,.09),transparent 34%);
    border-color:#2C333B}
  :root:not([data-theme="light"]) .rlbl{background:rgba(31,37,44,.95);
    border-color:rgba(160,185,205,.2);color:#DDE4EA;box-shadow:0 3px 9px rgba(0,0,0,.5)}
  :root:not([data-theme="light"]) .rlbl small{color:#8FA0AD}
  :root:not([data-theme="light"]) .rlbl.star{border-color:#B4653F;background:#33241C}
  :root:not([data-theme="light"]) .rlbl.star b{color:#EFA57F}
  :root:not([data-theme="light"]) .rline{background:rgba(24,29,35,.96);box-shadow:0 2px 7px rgba(0,0,0,.5)}
  :root:not([data-theme="light"]) .rstub{background:rgba(28,34,41,.94);border-color:#4A555F;color:#A9B5BF}
  :root:not([data-theme="light"]) .walk-label{background:rgba(31,37,44,.95)!important;
    border-color:rgba(160,185,205,.22)!important;color:#DDE4EA!important;
    box-shadow:0 2px 6px rgba(0,0,0,.5)!important}
  :root:not([data-theme="light"]) .leaflet-control-zoom a{background:#232830!important;color:#E4E9EE!important}
  :root:not([data-theme="light"]) .leaflet-control-attribution{background:rgba(20,24,29,.75)!important;color:#98A2AC!important}
  :root:not([data-theme="light"]) .leaflet-control-attribution a{color:#7FB0F0!important}
}

/* ============ walk map ============ */
.walk-card{padding:0;overflow:hidden}
.walk-card summary{list-style:none;padding:13px 14px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;cursor:pointer;min-height:52px}
.walk-card summary::-webkit-details-marker{display:none}
.walk-card summary b{display:block;font-size:13.5px;line-height:1.4}
.walk-card summary span{display:block;font-size:10.2px;color:var(--muted);margin-top:3px}
.walk-card summary em{flex:0 0 auto;font-style:normal;font-size:10.5px;font-weight:800;color:var(--day);
  background:var(--dayT);border-radius:8px;padding:5px 9px}
.walk-card[open] summary em:after{content:"　收合"}
.walk-tools{display:flex;gap:7px;padding:0 14px 10px;flex-wrap:wrap}
.walk-tools .btn{font-size:11.5px;min-height:40px;padding:8px}
.walk-map{height:clamp(280px,46dvh,440px);width:100%;background:var(--tile)}
.walk-legend{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px 0}
.walk-legend span{display:inline-flex;align-items:center;gap:6px;font-size:9.8px;font-weight:700;color:var(--ink2)}
.walk-legend i{display:block;width:20px;height:0;border-top:3px solid;border-color:inherit}
.walk-note{font-size:10.2px;color:var(--muted);line-height:1.7;padding:9px 14px 13px}
.walk-marker-wrap{background:none;border:none}
.walk-marker{display:flex;align-items:center;justify-content:center;width:34px;height:34px;
  border-radius:50%;background:#B0442E;color:#fff;font-size:12px;font-weight:800;
  border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.walk-marker.start{width:42px;height:42px;font-size:11px;background:#1F3E6B}
.walk-marker.optional{background:#77828D}
.walk-label{background:rgba(255,255,255,.95)!important;border:1px solid rgba(0,0,0,.1)!important;
  border-radius:7px!important;font-size:10px!important;font-weight:700!important;color:#1B2025!important;
  padding:2px 6px!important;box-shadow:0 2px 6px rgba(0,0,0,.15)!important}
.walk-label:before{display:none!important}

/* ============ places ============ */
.search{position:relative;margin-bottom:11px}
.search input{width:100%;border:1px solid var(--line);border-radius:13px;
  padding:12px 40px 12px 40px;font-size:15px;background:var(--card);box-shadow:var(--shL)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accentT)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;
  stroke:var(--muted);pointer-events:none}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;
  border-radius:9px;display:none;align-items:center;justify-content:center;color:var(--muted)}
.search .clr svg{position:static;transform:none;width:14px;height:14px;stroke:currentColor}
.search.has .clr{display:flex}
.pl{background:var(--card);border-radius:15px;padding:11px 12px;margin-bottom:9px;box-shadow:var(--sh)}
.pl .plh{display:flex;gap:10px;align-items:flex-start}
.pl .idx{flex:0 0 40px;width:40px;height:30px;border-radius:9px;background:var(--dayT);
  color:var(--day);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.pl .mid{flex:1;min-width:0}
.pl .n{font-size:13.6px;font-weight:700;line-height:1.45;letter-spacing:.1px}
.pl .ja{font-size:10.2px;color:var(--muted);margin-top:2px;line-height:1.5}
.pl .pnote{font-size:10.5px;color:var(--ink2);margin-top:4px;line-height:1.6}
.pl .plb{display:flex;align-items:center;gap:8px;margin-top:8px;padding-left:50px}
.pl .plb .tags{margin:0;flex:1;min-width:0}
.pl .act{flex:0 0 auto;display:flex;gap:6px}
.pl .tags .pill[data-jump]{cursor:pointer}

/* ============ near ============ */
.nb{background:var(--card);border-radius:15px;padding:11px 12px;margin-bottom:9px;
  box-shadow:var(--sh);display:flex;gap:11px;align-items:center}
.nb .dist{flex:0 0 58px;text-align:center}
.nb .dist b{display:block;font-size:15.5px;font-weight:800;color:var(--day);line-height:1.15;letter-spacing:-.3px}
.nb .dist span{font-size:9.5px;color:var(--muted);font-weight:600}
.nb .mid{flex:1;min-width:0}
.nb .mid .n{font-size:13.2px;font-weight:700;line-height:1.45}
.nb .mid .a{font-size:10.2px;color:var(--muted);margin-top:2px;font-weight:600}
.gpsbar{border-radius:13px;padding:11px 13px;font-size:12px;line-height:1.75;margin-bottom:11px;
  background:var(--accentT);color:var(--accentInk);border:1px solid var(--warnLine)}
.gpsbar.ok{background:var(--okT);color:var(--ok);border-color:var(--okLine)}
.gpsbar.err{background:var(--dangerT);color:var(--danger);border-color:var(--dangerLine)}

/* ============ util ============ */
.ph{border-bottom:1px solid var(--line2);padding:10px 0;display:flex;gap:10px;align-items:flex-start}
.ph:last-child{border:none;padding-bottom:2px}
.ph .txt{flex:1;min-width:0}
.ph .zh{font-size:12.5px;font-weight:700;color:var(--ink2)}
.ph .ja{font-size:14.5px;color:var(--day);margin-top:3px;font-weight:700;line-height:1.55}
.ph .ro{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.2px}
.tel{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line2)}
.tel:last-child{border:none;padding-bottom:2px}
.tel .ic2{flex:0 0 38px;height:38px;border-radius:12px;background:var(--sunk);
  display:flex;align-items:center;justify-content:center;font-size:17px;border:1px solid var(--line)}
.tel .n{flex:1;min-width:0}
.tel .n b{font-size:12.8px;display:block;line-height:1.45}
.tel .n span{font-size:10.2px;color:var(--muted);line-height:1.55;display:block;margin-top:2px}
.tel .call{background:var(--p2);color:#fff;border-radius:10px;padding:10px 13px;font-size:12px;
  font-weight:700;flex:0 0 auto;min-height:42px;display:flex;align-items:center}
:root[data-theme="dark"] .tel .call{color:#12211A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tel .call{color:#12211A}}
.addr{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.addr .ja{font-size:14.5px;font-weight:700;line-height:1.75;word-break:break-all}
.addr .ph2{color:var(--muted);font-weight:400;font-size:12.5px}
.fx{display:flex;gap:9px;align-items:center;margin-top:9px}
.fx label{font-size:11.5px;color:var(--muted);font-weight:700;flex:0 0 66px}
.fx input{flex:1;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:16px;
  text-align:right;background:var(--sunk);min-width:0;font-weight:700}
.fx input:focus{outline:none;border-color:var(--accent);background:var(--card)}
.fx .eq{background:var(--dayT);color:var(--day);border-color:transparent}
.ck{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.ck:last-child{border:none;padding-bottom:2px}
.ck .t{flex:1;font-size:11.8px;line-height:1.7;color:var(--ink2)}
.ck .t b{display:block;font-size:13.2px;margin-bottom:3px;color:var(--ink)}
.ck.on .t{opacity:.5}.ck.on .t b{text-decoration:line-through}
.mealrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line2)}
.mealrow:first-child{border-top:none}
.mealrow .mid{min-width:0;flex:1}
.io{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 11px;font-size:11px;
  background:var(--sunk);resize:vertical;min-height:92px;line-height:1.6;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  word-break:break-all}
.io:focus{outline:none;border-color:var(--accent);background:var(--card)}

/* ============ sheet (modal) ============ */
.sheetwrap{position:fixed;inset:0;z-index:200;display:none}
.sheetwrap.on{display:block}
.sheetbg{position:absolute;inset:0;background:rgba(12,15,18,.5);backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px)}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:var(--maxw);
  background:var(--bg);border-radius:22px 22px 0 0;box-shadow:var(--shPop);
  max-height:92dvh;display:flex;flex-direction:column;animation:up .24s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translate(-50%,26px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
.sheet header{padding:14px 16px 10px;border-bottom:1px solid var(--line2);display:flex;
  align-items:center;gap:10px;flex:0 0 auto}
.sheet header h3{flex:1;font-size:15.5px;font-weight:800;min-width:0}
.sheet header .x{width:34px;height:34px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex:0 0 34px}
.sheet header .x svg{width:15px;height:15px;stroke:var(--ink2)}
.sheet .body{padding:14px 16px calc(18px + var(--safeb));overflow-y:auto;-webkit-overflow-scrolling:touch}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:10.5px;font-weight:800;color:var(--muted);
  letter-spacing:.6px;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:11px;
  padding:11px 12px;font-size:15px;background:var(--card);min-height:44px}
.fld textarea{min-height:64px;resize:vertical;line-height:1.6;font-size:13.5px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accentT)}
.fld.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fld.two>div{min-width:0}
.fld .hint{margin-top:4px}
.segsel{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.segsel button{flex:1;padding:9px 4px;border-radius:9px;font-size:12px;font-weight:700;color:var(--muted);min-height:42px}
.segsel button.on{background:var(--card);color:var(--day);box-shadow:var(--shL)}

/* ============ nav ============ */
nav{position:fixed;left:0;right:0;bottom:0;z-index:90;max-width:var(--maxw);margin:0 auto;
  background:var(--navbar);backdrop-filter:saturate(1.7) blur(18px);
  -webkit-backdrop-filter:saturate(1.7) blur(18px);
  border-top:1px solid var(--line2);padding-bottom:var(--safeb);display:flex;
  box-shadow:0 -2px 18px -10px var(--shade)}
nav button{flex:1;height:var(--nav);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:var(--muted);font-size:9.5px;font-weight:700;
  letter-spacing:.3px;position:relative;transition:color .18s}
nav button svg{width:20px;height:20px;stroke-width:1.9}
nav button.on{color:var(--day)}
nav button.on:before{content:"";position:absolute;top:5px;width:26px;height:3px;border-radius:99px;background:var(--day)}
.view{display:none;animation:fade .22s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--safeb) + 16px);transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:12.5px;
  font-weight:700;z-index:300;box-shadow:var(--shPop);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;max-width:88vw;text-align:center;line-height:1.5}
.toast.on{opacity:1;transform:translate(-50%,-6px)}

</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <h1><span class="leaf"></span>關西秋旅 · 京都大阪奈良</h1>
      <div class="sub" id="topsub">11/7（六）- 11/15（日）· 9 天 8 夜</div>
    </div>
    <button class="topbtn" id="themeBtn" aria-label="切換主題"></button>
    <div class="dcount" id="dcount"><b>–</b><span>DAY</span></div>
  </header>
  <div id="banners"></div>

  <section class="view on" id="v-now"><div class="wrap" id="nowBody"></div></section>

  <section class="view" id="v-plan">
    <div class="chipbar sticky" id="dayChips"></div>
    <div class="wrap" id="planBody"></div>
  </section>

  <section class="view" id="v-map">
    <div class="wrap">
      <div class="seg" id="mapSeg">
        <button data-mode="google" class="on">Google 動線</button>
        <button data-mode="geo">概覽圖</button>
        <button data-mode="rail">路網圖</button>
      </div>
      <div class="chipbar inline" id="mapChips"></div>

      <div id="modeGoogle"><div id="gmRouteBody"></div></div>

      <div id="modeGeo" style="display:none">
        <div class="mapbox"><div id="map"></div><div class="tilebadge" id="tileBadge"></div></div>
        <div class="btns">
          <button class="btn" id="locBtn"></button>
          <button class="btn" id="fitBtn"></button>
          <button class="btn" id="tileBtn"></button>
        </div>
        <p class="mnote" id="mapNote"></p>
      </div>

      <div id="modeRail" style="display:none">
        <div class="seg sm2" id="railSeg">
          <button data-lay="osaka" class="on">大阪市中心</button>
          <button data-lay="kansai">關西廣域</button>
          <button data-lay="kyoto">京都市區</button>
        </div>
        <div class="chipbar inline" id="railDayChips"></div>
        <div class="railhead" id="railHead"></div>
        <div class="mapbox railbox"><div id="railmap"></div></div>
        <div class="raillegend" id="railLegend"></div>
        <div class="btns">
          <button class="btn" id="railFit">回到預設大小</button>
          <button class="btn" id="railWhole">縮到全圖</button>
        </div>
        <p class="mnote" id="railNote"></p>
      </div>
    </div>
  </section>

  <section class="view" id="v-place">
    <div class="wrap">
      <div class="search" id="searchBox">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜尋地點、日文名、筆記、行程…" autocomplete="off" enterkeyhint="search">
        <button class="clr" id="qClr" aria-label="清除搜尋"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="chipbar inline" id="areaChips"></div>
      <div class="chipbar inline" id="statusChips"></div>
      <div id="placeBody"></div>

  const P='kx2_';
  const api={
    get(k,d){try{if(ok){const v=localStorage.getItem(P+k);if(v!=null)return JSON.parse(v)}}catch(e){}
      return k in mem?mem[k]:d},
    set(k,v){mem[k]=v;try{if(ok)localStorage.setItem(P+k,JSON.stringify(v))}catch(e){}},
    del(k){delete mem[k];try{if(ok)localStorage.removeItem(P+k)}catch(e){}},
    keys(){const out=new Set(Object.keys(mem));
      try{if(ok)for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
        if(k&&k.indexOf(P)===0)out.add(k.slice(P.length))}}catch(e){}
      return [...out]},
    ok(){return ok}
  };
  /* 舊版 kx_ 的打勾／筆記／選擇自動接手，換版不遺失 */
  if(ok&&!api.get('__migrated',false)){
    try{
      ['done','notes','checks','route_choices','addr_kyoto','addr_osaka','rate'].forEach(k=>{
        const v=localStorage.getItem('kx_'+k);
        if(v!=null&&localStorage.getItem(P+k)==null)localStorage.setItem(P+k,v);
      });
    }catch(e){}
    api.set('__migrated',true);
  }
  return api;
})();

/* 合併後的一日行程（含自訂，依時間排序，附穩定 uid） */
function dayItems(di){
  const base=DAYS[di].it.map((x,i)=>Object.assign({},x,{uid:di+'_'+i,_i:i}));
  const mine=(customItems()[di]||[]).map(x=>Object.assign({},x,{mine:1}));
  const all=base.concat(mine);
  all.sort((a,b)=>hm(a.a)-hm(b.a)||hm(a.b)-hm(b.b));
  /* 標記「整段包住其他行程」的容器（USJ 全日、跟團段） */
  all.forEach(x=>{x.span=false;x.inside=null});
  all.forEach(x=>{
    const s=hm(x.a),e=hm(x.b);
    if(e-s<180)return;
    if(all.some(y=>y!==x&&hm(y.a)>=s&&hm(y.b)<=e&&hm(y.b)-hm(y.a)<e-s))x.span=true;
  });
  all.forEach(x=>{
    if(x.span)return;
    const c=all.find(y=>y.span&&hm(x.a)>=hm(y.a)&&hm(x.b)<=hm(y.b));
    if(c)x.inside=c.n;
  });
  return all;
}

function liveItem(list,mins){
  const hit=list.filter(x=>mins>=hm(x.a)&&mins<hm(x.b));
  if(!hit.length)return null;
  return hit.sort((a,b)=>(hm(a.b)-hm(a.a))-(hm(b.b)-hm(b.a)))[0];
}
function spanItem(list,mins){
  return list.find(x=>x.span&&mins>=hm(x.a)&&mins<hm(x.b))||null;
}

const MASTER_LINK=(()=>{

function gmRoute(stops){
  if(!stops.length)return '#';
  if(stops.length<2)return gview(stops[0].o);
  const a=stops[0].o,b=stops[stops.length-1].o,mid=stops.slice(1,-1);
  return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(gmPlace(a))+
    '&destination='+encodeURIComponent(gmPlace(b))+
    (mid.length?'&waypoints='+encodeURIComponent(mid.map(x=>gmPlace(x.o)).join('|')):'');
}
function dist(a,b,c,d){const R=6371,r=Math.PI/180,dLa=(c-a)*r,dLo=(d-b)*r;
  const x=Math.sin(dLa/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(x))}

/* ============ A/B 路線決策 ============ */
function routeChoice(date,id,fb){
  const all=store.get('route_choices',{});return (all[date]&&all[date][id])||fb||'A';
}
function renderRouteDecisions(di){
  const d=DAYS[di],cards=ROUTE_DECISIONS[d.d]||[];
  return cards.map(card=>{
    const pick=routeChoice(d.d,card.id,card.def),o=card.opts[pick],other=card.opts[pick==='A'?'B':'A'];
    const metric=(k,v)=>'<div class="decisionmetric"><span>'+k+'</span><b>'+esc(v)+'</b></div>';
    const row=(k,f)=>'<tr><th>'+k+'</th><td class="pick">'+esc(f(o))+'</td><td>'+esc(f(other))+'</td></tr>';
    return '<section class="decisiondeck" data-decision="'+card.id+'"><div class="decisiontop">'+
      '<div class="ey">ROUTE DECISION · 已選 '+pick+'</div><h3>'+esc(card.title)+'</h3><p>'+esc(card.sub)+'</p></div>'+
      '<div class="decisiontabs">'+['A','B'].map(k=>'<button class="decisiontab'+(k===pick?' on':'')+'" data-routepick="'+k+'">'+
        '<b>'+k+'　'+esc(card.opts[k].name)+'</b><span>'+esc(card.opts[k].tag)+'</span></button>').join('')+'</div>'+
      '<div class="decisionpanel"><div class="decisionbadge">'+pick+' · '+esc(o.tag)+'</div>'+
      '<div class="decisionmetrics">'+metric('所需時間',o.time)+metric('費用',o.cost)+metric('步行',o.walk)+
        metric('轉乘',o.transfers)+metric('大行李',o.luggage)+metric('方案',o.name)+'</div>'+
      '<div class="decisionsteps">'+o.steps.map(s=>'<div class="decisionstep">'+esc(s)+'</div>').join('')+'</div>'+
      '<div class="decisionwhen"><b>何時選：</b>'+esc(o.when)+'</div>'+
      '<div class="decisionresult"><b>選 '+pick+' 後的結果</b>'+esc(o.result)+'</div>'+
      '<div class="decisionnote"><b>注意：</b>'+esc(o.note)+'</div>'+
      '<div class="decisionactions"><a class="mapa" href="'+o.map+'" target="_blank" rel="noopener">'+
        IC.mapPin+'在 Google Maps 開啟</a></div></div>'+
      '<details class="cmp"><summary><span>A / B 並排比較</span>'+IC.down+'</summary>'+
        '<table class="cmptab"><tr><th></th><td class="pick">'+pick+'　'+esc(o.name)+'</td><td>'+
        (pick==='A'?'B':'A')+'　'+esc(other.name)+'</td></tr>'+
        row('時間',x=>x.time)+row('費用',x=>x.cost)+row('步行',x=>x.walk)+
        row('轉乘',x=>x.transfers)+row('大行李',x=>x.luggage)+row('結果',x=>x.result)+
      '</table></details>'+
      '<div class="decisionstamp">選擇會保存在這支手機 · 交通時刻於前一晚再確認</div></section>';
  }).join('');
}
function bindRouteDecisions(root,di){
  root.querySelectorAll('[data-routepick]').forEach(btn=>btn.onclick=()=>{
    const card=btn.closest('[data-decision]'),all=store.get('route_choices',{}),date=DAYS[di].d;
    all[date]=all[date]||{};all[date][card.dataset.decision]=btn.dataset.routepick;
    store.set('route_choices',all);
    toast('已選擇方案 '+btn.dataset.routepick);
    if(root.id==='planBody')renderPlan();else renderNow();
  });
}

/* ============ 營業時間稽核 ============ */
function auditCard(di){
  const rows=DAY_AUDIT[di]||[];
  if(!rows.length)return '';
  const label={ok:'符合',warn:'注意',check:'再確認'};
  return '<div class="auditcard"><div class="ah"><h3>營業時間・適合時段・季節檢查</h3>'+
    '<span>官方資料核對 2026/08/24</span></div>'+rows.map(a=>
      '<div class="auditrow"><span class="auditstate '+a.s+'">'+label[a.s]+'</span><span>'+esc(a.t)+'</span>'+
      (a.u?'<a href="'+esc(a.u)+'" target="_blank" rel="noopener">官網</a>':'<span></span>')+'</div>').join('')+'</div>';
}

/* ============ 當天移動簡圖 ============ */
function routeStrip(d){
  if(!d.route||!d.route.length)return '';
  let h='',prev=null;
  d.route.forEach(r=>{
    if(r.f!==prev){if(prev!==null)h+='<div class="gap"></div>';h+='<div class="st">'+esc(r.f)+'</div>'}
    h+='<div class="ln"><div class="bar" style="background:'+esc(r.c)+'"></div>'+
       '<div class="lb">'+esc(r.l)+'</div><div class="mn">約 '+esc(r.m)+' 分</div>'+
       (r.n?'<div class="nt">'+esc(r.n)+'</div>':'')+'</div>';
    h+='<div class="st">'+esc(r.t)+'</div>';
    prev=r.t;
  });
  return '<div class="route"><div class="rh">當天移動</div><div class="legs">'+h+'</div></div>';
}

    };
    cb.onclick=flip;
    cb.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')flip(e)};
    const ta=it.querySelector('[data-nt]');
    if(ta)ta.oninput=()=>{const o=notes();o[key]=ta.value;if(!ta.value)delete o[key];store.set('notes',o)};
    const cp=it.querySelector('[data-cp]');
    if(cp)cp.onclick=e=>{e.stopPropagation();copy(cp.dataset.cp,cp)};
    const ed=it.querySelector('[data-edit]');
    if(ed)ed.onclick=()=>openItemSheet(curDay,ed.dataset.edit);
    const dl=it.querySelector('[data-del]');
    if(dl)dl.onclick=()=>{
      if(!confirm('確定要刪除這筆自訂行程嗎？'))return;
      const all=customItems();
      all[curDay]=(all[curDay]||[]).filter(v=>v.uid!==dl.dataset.del);
      store.set('items',all);
      const o=done(),n=notes();delete o[dl.dataset.del];delete n[dl.dataset.del];
      store.set('done',o);store.set('notes',n);
      toast('已刪除');renderPlan();
    };
  });
}

/* ============ 步行地圖 ============ */
let walkMapObj=null,walkLocateMarker=null,walkDi=null;
function autoWalkMap(di){
  /* 沒有手繪地圖的日子，用當天有座標的地點自動產生一張 */
  const P=allPOI(),seen=new Set(),pts=[];
  dayItems(di).forEach(x=>{
    const o=x.o&&P[x.o];
    if(!o||o.noMap||!Number.isFinite(o.lat)||seen.has(x.o))return;
    seen.add(x.o);pts.push({seq:String(pts.length+1),name:o.n,lat:o.lat,lng:o.lng,time:x.a+'–'+x.b});
  });
  if(pts.length<2)return null;
  const span=Math.max(...pts.map(p=>p.lat))-Math.min(...pts.map(p=>p.lat));
  return{
    title:md(DAYS[di].d)+' 當日地點地圖（自動產生）',
    meta:pts[0].time.split('–')[0]+'–'+pts[pts.length-1].time.split('–')[1]+' · '+pts.length+' 個地點'+
      (span>0.25?' · 含長距離移動':''),
    note:'這張圖由當天行程中有座標的地點自動排序產生，連線是順序示意，不是實際路徑；實際走法請開 Google Maps。',
    markers:pts,
    routes:[{name:'行程順序',color:'#B0442E',points:pts.map(p=>[p.lat,p.lng])}],
    gm:gmRoute(pts.map(p=>({o:{pre:'exact',lat:p.lat,lng:p.lng,n:p.name}}))),
    auto:true
  };
}
function walkMapData(di){return WALK_MAPS[di]||autoWalkMap(di)}
function walkMapPanel(di){
  const m=walkMapData(di);if(!m)return '';
  const legend=m.routes.map(r=>'<span style="color:'+esc(r.color)+'"><i style="border-top-style:'+
    (r.dash?'dashed':'solid')+'"></i><span style="color:var(--ink2)">'+esc(r.name)+'</span></span>').join('');
  return '<details class="card walk-card" id="walkDetails-'+di+'"><summary><div><b>'+IC.walk+' '+esc(m.title)+
    '</b><span>'+esc(m.meta)+'</span></div><em>點開</em></summary>'+
    '<div class="walk-tools"><button class="btn" id="walkFit-'+di+'">回到全圖</button>'+
    '<button class="btn" id="walkLocate-'+di+'">'+IC.near+'我的位置</button>'+
    '<a class="btn gm" href="'+esc(m.gm||'#')+'" target="_blank" rel="noopener">'+IC.mapPin+'Google Maps</a></div>'+
    '<div class="walk-map" id="walkMap-'+di+'" aria-label="'+esc(m.title)+'"></div>'+
    '<div class="walk-legend">'+legend+'</div>'+
    '<p class="walk-note" id="walkStatus-'+di+'">上方為北；點編號可看時間與名稱。'+esc(m.note||'')+'</p></details>';
}
function bindWalkMap(di){
  const el=document.getElementById('walkDetails-'+di);if(!el)return;
  if(walkMapObj){try{walkMapObj.remove()}catch(_){}walkMapObj=null}
  walkLocateMarker=null;walkDi=di;
  el.addEventListener('toggle',()=>{if(el.open)setTimeout(()=>initWalkMap(di),80)});
}
function initWalkMap(di){
  const m=walkMapData(di),mount=document.getElementById('walkMap-'+di);
  if(walkMapObj||!m||!mount)return;
  const statusEl=document.getElementById('walkStatus-'+di);
  if(typeof L==='undefined'){statusEl.textContent='地圖元件載入失敗，請改用 Google Maps。';return}
  walkMapObj=L.map(mount,{zoomControl:true,minZoom:5,maxZoom:20,preferCanvas:true});
  const t=TILES[tileIdx]||TILES[0];
  L.tileLayer(t.u,{subdomains:t.s||'abc',maxZoom:t.max,attribution:t.a}).addTo(walkMapObj);
  const icon=p=>{
    const large=String(p.seq).includes('/');
    return L.divIcon({className:'walk-marker-wrap',
      html:'<span class="walk-marker'+(large?' start':'')+(p.optional?' optional':'')+'">'+esc(p.seq)+'</span>',
      iconSize:[large?42:34,large?42:34],iconAnchor:[large?21:17,large?21:17]});
  };
  m.markers.forEach((p,i)=>L.marker([p.lat,p.lng],{icon:icon(p),title:p.name}).addTo(walkMapObj)
    .bindTooltip(p.name,{permanent:true,direction:i%3===1?'left':(i%3===2?'top':'right'),className:'walk-label'})
    .bindPopup('<div class="pop"><b>'+esc(p.seq)+' '+esc(p.name)+'</b><div class="ar">'+esc(p.time)+'</div>'+
      '<div class="acts"><a href="https://www.google.com/maps/search/?api=1&query='+p.lat+'%2C'+p.lng+
      '" target="_blank" rel="noopener">Google Maps</a>'+
      '<a class="alt" href="https://www.google.com/maps/dir/?api=1&destination='+p.lat+'%2C'+p.lng+
      '&travelmode=walking" target="_blank" rel="noopener">步行導航</a></div></div>'));
  m.routes.forEach(r=>L.polyline(r.points,{color:r.color,weight:6,opacity:.9,dashArray:r.dash||null,lineJoin:'round'}).addTo(walkMapObj));
  const bounds=L.latLngBounds(m.markers.map(p=>[p.lat,p.lng]));
  const fit=()=>walkMapObj.fitBounds(bounds,{padding:[55,55],maxZoom:17});
  fit();
  document.getElementById('walkFit-'+di).onclick=fit;
  document.getElementById('walkLocate-'+di).onclick=()=>{
    if(!navigator.geolocation){statusEl.textContent='此瀏覽器不支援定位。';return}
    statusEl.textContent='正在取得目前位置…';
    navigator.geolocation.getCurrentPosition(p=>{
      if(walkLocateMarker)walkMapObj.removeLayer(walkLocateMarker);
      walkLocateMarker=L.circleMarker([p.coords.latitude,p.coords.longitude],
        {radius:8,color:'#fff',weight:3,fillColor:'#8e24aa',fillOpacity:1}).addTo(walkMapObj)
        .bindTooltip('目前位置',{permanent:true,direction:'right',className:'walk-label'});
      walkMapObj.setView([p.coords.latitude,p.coords.longitude],17);
      statusEl.textContent='已定位；GPS 精度約 ±'+Math.round(p.coords.accuracy)+' 公尺。'+(m.note||'');
    },()=>statusEl.textContent='未能取得位置，請確認瀏覽器定位權限。',
      {enableHighAccuracy:true,timeout:10000,maximumAge:30000});
  };
  setTimeout(()=>walkMapObj.invalidateSize(),120);
}

/* ============ 地圖：Google 動線 ============ */
function gmStopsForDay(di){
  const seen=new Set(),out=[],P=allPOI();
  dayItems(di).forEach(x=>{
    const o=x.o&&P[x.o];
    if(!o||o.noMap)return;
    const key=Number.isFinite(o.lat)?o.lat.toFixed(4)+','+o.lng.toFixed(4):norm(o.ja||o.n);
    if(seen.has(key))return;seen.add(key);
    out.push({o,id:x.o,a:x.a,b:x.b,n:x.n});
  });
  return out;
}
function gmRouteGroups(stops){
  if(stops.length<=5)return stops.length?[stops]:[];
  const out=[];for(let i=0;i<stops.length-1;i+=4)out.push(stops.slice(i,i+5));
  return out;
}
function gmDayCard(di,compact){
  const d=DAYS[di],stops=gmStopsForDay(di),groups=gmRouteGroups(stops);
  if(!groups.length)return '';
  const links=groups.map((g,i)=>'<a class="openroute" href="'+gmRoute(g)+'" target="_blank" rel="noopener">'+
    IC.mapPin+(groups.length>1?'開啟第 '+(i+1)+' 段（'+g[0].a+'–'+g[g.length-1].b+'）':'在 Google Maps 開啟今日動線')+'</a>').join('');
  return '<div class="gmroute"><div class="topline"><div><div class="rt">'+
    (compact?md(d.d)+'　':'')+esc(d.t)+'</div><div class="rs">'+
    stops.length+' 個地點'+(groups.length>1?'，已分成 '+groups.length+' 段':'，依行程順序排列')+
    '</div></div><span class="pill '+d.th+'">D'+(di+1)+'</span></div>'+links+'</div>';
}

/* ============ 地圖：概覽圖 ============ */
function useTiles(i,manual){
  if(!mapObj)return;
  tileIdx=(i+TILES.length)%TILES.length;
  const t=TILES[tileIdx];
  if(tileLayer)mapObj.removeLayer(tileLayer);
  let loaded=0,failed=0;
  const badge=$('#tileBadge');
  tileLayer=L.tileLayer(t.u,{subdomains:t.s||'abc',maxZoom:t.max,detectRetina:true,
    attribution:t.a,crossOrigin:true}).addTo(mapObj);
  tileLayer.on('tileload',()=>{loaded++;badge.style.display='none'});
  tileLayer.on('tileerror',()=>{
    failed++;
    if(loaded===0&&failed>=5&&!manual&&tileIdx<TILES.length-1){useTiles(tileIdx+1)}
    else if(loaded===0&&failed>=5){
      badge.textContent=offline?'離線中，底圖無法載入；標記與清單仍可使用':'底圖載入失敗，標記仍可使用';
      badge.style.display='block';
    }
  });
  if(offline){badge.textContent='離線中，底圖可能無法載入';badge.style.display='block'}
  $('#mapNote').innerHTML='底圖：'+esc(t.n)+'　·　數字是當天的行程順序，虛線是動線。'+
    '同一棟樓的店（例如 HEP FIVE 那三家）會合併成一個標記。'+
    '<br>底圖載不出來時可按「換底圖」切換供應商；完全離線時請改用「路網圖」。';
}
function mapPoints(){
  const out=[],seen=new Set(),P=allPOI();
  const src=mapDay==='all'?DAYS.map((d,i)=>({i})):[{i:+mapDay}];
  src.forEach(({i})=>dayItems(i).forEach(x=>{
    const o=x.o&&P[x.o];
    if(o&&!seen.has(x.o)&&!o.noMap&&Number.isFinite(o.lat)){seen.add(x.o);out.push({id:x.o,di:i})}}));
  if(mapDay==='all'){
    Object.entries(P).forEach(([id,o])=>{
      if(o.mine&&!seen.has(id)&&Number.isFinite(o.lat)){seen.add(id);out.push({id,di:0,extra:1})}
    });
  }
  return out;
}

function initMap(){
  if(mapObj){setTimeout(()=>{mapObj.invalidateSize();drawMarkers()},60);return}
  mapObj=L.map('map',{zoomControl:true,attributionControl:true,tap:false}).setView([34.85,135.6],9);
  useTiles(tileIdx);
  drawMarkers();
  mapObj.on('zoomend',renderClusters);
  setTimeout(()=>mapObj.invalidateSize(),120);
  setTimeout(()=>{mapObj.invalidateSize();drawMarkers()},450);
}
let MG=[],MSEQ=false,MDI=0,polyLayer=null;
function drawMarkers(focus){
  if(!mapObj)return;
  const pts=mapPoints(),byKey={},P=allPOI();MG=[];MSEQ=mapDay!=='all';MDI=MSEQ?+mapDay:0;
  pts.forEach(({id,di,extra})=>{
    const o=P[id];if(!o||!Number.isFinite(o.lat))return;
    const k=o.lat.toFixed(4)+','+o.lng.toFixed(4);
    if(byKey[k]){byKey[k].list.push(o);return}
    byKey[k]={lat:o.lat,lng:o.lng,di,extra:!!extra,list:[o]};MG.push(byKey[k]);
  });
  if(polyLayer){mapObj.removeLayer(polyLayer);polyLayer=null}
  if(MSEQ&&MG.length>1)
    polyLayer=L.polyline(MG.map(g=>[g.lat,g.lng]),{color:dayColor(DAYS[MDI].th),
      weight:3.5,opacity:.45,dashArray:'2,9',lineCap:'round'}).addTo(mapObj);
  if(focus)mapObj.setView([focus.lat,focus.lng],16);
  else if(MG.length)mapObj.fitBounds(MG.map(g=>[g.lat,g.lng]),{padding:[42,42],maxZoom:15});
  renderClusters();
}
function dayColor(th){
  const cs=getComputedStyle(document.documentElement);
  return (cs.getPropertyValue('--c-'+(THKEY[th]||'kyoto'))||'#B0442E').trim();
}
function popHTML(list,no){
  const head=list[0];
  return '<div class="pop"><b>'+(no?no+'. ':'')+
    esc(list.length>1?(head.area||'')+'（'+list.length+' 個地點）':head.n)+'</b>'+
    '<div class="ar">'+esc(head.area||'')+(head.pre==='area'?'　·　位置概略':'')+(head.mine?'　·　自訂地點':'')+'</div>'+
    (head.hours?'<div class="ls"><b>營業</b>　'+esc(head.hours)+'</div>':'')+
    (list.length>1?'<div class="ls">'+list.map(o=>'· '+esc(o.n)+
      (o.p?' <b style="color:var(--p1)">P'+o.p+'</b>':'')).join('<br>')+'</div>'
      :(head.p?'<div class="ls">優先度 P'+head.p+'</div>':''))+
    '<div class="acts"><a href="'+gview(head)+'" target="_blank" rel="noopener">Google Maps</a>'+
    '<a class="alt" href="'+gnav(head)+'" target="_blank" rel="noopener">導航</a></div></div>';

function renderClusters(){
  if(!mapObj)return;
  markers.forEach(m=>mapObj.removeLayer(m));markers=[];
  const z=mapObj.getZoom();
  const P=MG.map((g,i)=>({g,i,pt:mapObj.project([g.lat,g.lng],z)}));
  const used=new Array(P.length).fill(false),cl=[];
  for(let i=0;i<P.length;i++){
    if(used[i])continue;used[i]=true;
    const m=[P[i]];
    for(let j=i+1;j<P.length;j++){
      if(used[j])continue;
      if(P[i].pt.distanceTo(P[j].pt)<40){m.push(P[j]);used[j]=true}
    }
    cl.push(m);
  }
  cl.forEach(m=>{
    const first=m[0],c=first.g.extra?'#7A5BA8':dayColor(DAYS[first.g.di].th);
    const many=m.length>1;
    const lat=m.reduce((s,x)=>s+x.g.lat,0)/m.length, lng=m.reduce((s,x)=>s+x.g.lng,0)/m.length;
    const label=many?m.length:(MSEQ?first.i+1:(first.g.list[0].p||'·'));
    const sz=many?32:26;
    const ic=L.divIcon({className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],
      html:'<div style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:'+c+
        ';border:'+(many?3:2.5)+'px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);display:flex;'+
        'align-items:center;justify-content:center;color:#fff;font-size:'+(many?12.5:11.5)+
        'px;font-weight:800;font-family:inherit'+(many?';outline:4px solid '+c+'33':'')+'">'+label+'</div>'});
    const mk=L.marker([lat,lng],{icon:ic,zIndexOffset:many?900:first.i,riseOnHover:true}).addTo(mapObj);
    if(many){
      mk.bindTooltip(m.length+' 個地點，點一下放大',{direction:'top',offset:[0,-18]});
      mk.on('click',()=>mapObj.fitBounds(m.map(x=>[x.g.lat,x.g.lng]),{padding:[70,70],maxZoom:17}));
    }else{
      mk.bindPopup(popHTML(first.g.list,MSEQ?first.i+1:0),{maxWidth:250});
    }
    markers.push(mk);
  });
}

/* ============ 地圖：路網示意圖（完全離線） ============ */
const RSC=8;
const rxy=s=>[-s.y*RSC, s.x*RSC];
const rparts=s=>String(s).replace(/[\s（）()]/g,'').split(/[\/／]/)
  .map(x=>x.replace(/站$|駅$/,'').replace(/住宿$/,'').replace(/前夕陽ヶ丘$/,'前')
           .replace(/^JR/,'').replace(/T\d$/,'').replace(/第\d?ターミナル$/,''))
  .filter(Boolean);
/* 站名寫法不一（關西機場 T1／關西機場、京都站／京都），用包含關係比對才不會漏 */
const rhit=(name,set)=>{
  if(!set)return false;
  const mine=rparts(name);
  for(const a of mine){
    if(set.has(a))return true;
    if(a.length<2)continue;
    for(const b of set){
      if(b.length<2)continue;
      if(a===b||a.indexOf(b)===0||b.indexOf(a)===0)return true;
    }
  }
  return false;
};
function initRail(){
  if(!railMap){
    railMap=L.map('railmap',{crs:L.CRS.Simple,minZoom:-4,maxZoom:4,zoomSnap:.25,
      attributionControl:false,zoomControl:false});
    L.control.zoom({position:'bottomright'}).addTo(railMap);
  }else{railMap.invalidateSize()}
  drawRail();
}
function railDayStations(){
  if(railDay==='all')return null;
  const set=new Set();
  (DAYS[+railDay].route||[]).forEach(r=>{
    rparts(r.f).forEach(x=>set.add(x));rparts(r.t).forEach(x=>set.add(x))});
  return set;
}
function railMatchCount(layKey,hi){
  if(!hi)return 99;
  const S=RAIL.LAYOUTS[layKey].S;
  return Object.values(S).filter(s=>rhit(s.n,hi)).length;
}
/* 選了某一天，就自動切到真的畫得出那天路線的那張圖 */
function bestRailLayout(hi){
  if(!hi)return railLay;
  const keys=Object.keys(RAIL.LAYOUTS);
  let best=railLay,bestN=railMatchCount(railLay,hi);
  keys.forEach(k=>{const n=railMatchCount(k,hi);if(n>bestN){best=k;bestN=n}});
  return bestN>0?best:railLay;
}
/* 站點與標籤的底色要跟著深淺色走，深色模式才不會是一塊白板 */
function paperInk(){
  const cs=getComputedStyle(document.documentElement);
  const dark=(cs.getPropertyValue('--railpaper-dark')||'').trim()==='1';
  return dark?{fill:'#232A31',stroke:'#9FB0BE',big:'#CBD8E2'}:{fill:'#fff',stroke:'#3B4B55',big:'#203848'};
}
function renderRailMeta(lay,hi){
  const used=hi?Object.values(lay.S).filter(s=>rhit(s.n,hi)).length:Object.keys(lay.S).length;
  const active=hi?'D'+(+railDay+1)+' · '+md(DAYS[+railDay].d)
    :(railDay==='all'?'全部日程':'D'+(+railDay+1)+' 不在此圖');
  $('#railHead').innerHTML='<div class="rey">KANSAI TRANSIT · SCHEMATIC 2026</div><h3>'+esc(lay.title)+'</h3>'+
    '<p>'+esc(lay.sub)+'</p><div class="railstats"><span class="railstat"><b>'+used+'</b> 站</span>'+
    '<span class="railstat"><b>'+lay.L.length+'</b> 路線</span><span class="railstat">'+esc(active)+'</span>'+
    '<span class="railstat">離線可用</span></div>';
  $('#railLegend').innerHTML=lay.L.map(l=>'<span class="railli"><i style="background:'+esc(l.c)+'"></i>'+esc(l.n)+'</span>').join('')+
    ((lay.DASH||[]).map(l=>'<span class="railli"><i style="background:'+esc(l.c)+'"></i>'+esc(l.n)+'</span>').join(''))+
    (lay.WALK.length?'<span class="railli walk"><i></i>步行轉乘</span>':'');
}
function drawRail(){
  let hi=railDayStations();
  if(hi){
    const best=bestRailLayout(hi);
    if(best!==railLay){
      railLay=best;
      $$('#railSeg button').forEach(x=>x.classList.toggle('on',x.dataset.lay===railLay));
    }
  }
  const lay=RAIL.LAYOUTS[railLay],S=lay.S;
  railLayers.forEach(l=>railMap.removeLayer(l));railLayers=[];
  const nMatch=railMatchCount(railLay,hi);
  if(hi&&nMatch===0)hi=null;   /* 這張圖畫不到這天：顯示完整路網，不要整張變灰 */
  const dim=hi?(nMatch<=2?0.5:0.22):1,PI=paperInk();
  const add=l=>{l.addTo(railMap);railLayers.push(l);return l};
  lay.WALK.forEach(([a,b])=>add(L.polyline([rxy(S[a]),rxy(S[b])],
    {color:'#9EA5A8',weight:2.3,dashArray:'2,6',opacity:dim,lineCap:'round'})));
  (lay.DASH||[]).forEach(l=>add(L.polyline(l.p.map(i=>rxy(S[i])),
    {color:PI.fill,weight:9,dashArray:'8,6',opacity:dim,lineCap:'round'})));
  (lay.DASH||[]).forEach(l=>add(L.polyline(l.p.map(i=>rxy(S[i])),
    {color:l.c,weight:4.5,dashArray:'8,6',opacity:dim,lineCap:'round'})));
  lay.L.forEach(l=>add(L.polyline(l.p.map(i=>rxy(S[i])),
    {color:PI.fill,weight:13,lineCap:'round',lineJoin:'round',opacity:dim})));
  lay.L.forEach(l=>{
    const on=hi?l.p.some(i=>rhit(S[i].n,hi)):true;
    add(L.polyline(l.p.map(i=>rxy(S[i])),
      {color:l.c,weight:6.5,lineCap:'round',lineJoin:'round',opacity:on?1:dim})).bindTooltip(l.n,{sticky:true});
  });
  (lay.STUB||[]).forEach(([sid,dx,dy,txt])=>{
    const s=S[sid],e={x:s.x+dx*0.5,y:s.y+dy*0.5};
    add(L.polyline([rxy(s),rxy(e)],{color:'#9A9284',weight:2.5,dashArray:'5,4',opacity:dim}));
    add(L.marker(rxy(e),{interactive:false,icon:L.divIcon({className:'',iconSize:[0,0],
      iconAnchor:[dx<0?110:(dx===0?55:-10),dy<0?26:-2],
      html:'<div class="rstub">'+txt.split('\n').map(esc).join('<br>')+'</div>'})}));
  });
  lay.L.concat(lay.DASH||[]).forEach(l=>{
    if(!l.lbl)return;
    add(L.marker(rxy({x:l.lbl[0],y:l.lbl[1]}),{interactive:false,
      icon:L.divIcon({className:'',iconSize:[0,0],iconAnchor:[0,8],
        html:'<div class="rline" style="color:'+esc(l.c)+'">'+esc(l.n)+'</div>'})}));
  });
  Object.entries(S).forEach(([id,s])=>{
    const big=!!s.big,on=!hi||rhit(s.n,hi);
    if(hi&&on)add(L.circleMarker(rxy(s),{radius:big?16:13,color:'#E8873B',weight:2.5,
      fillColor:'#E8873B',fillOpacity:.14}));
    const mk=add(L.circleMarker(rxy(s),{radius:big?8.5:5.5,color:big?PI.big:PI.stroke,
      weight:big?3:2,fillColor:PI.fill,fillOpacity:1,opacity:on?1:.30}));
    const lines=lay.L.filter(l=>l.p.includes(id)).map(l=>
      '<span style="display:inline-block;border-radius:5px;padding:2px 7px;margin:3px 4px 0 0;'+
      'font-size:10.5px;font-weight:700;color:#fff;background:'+esc(l.c)+'">'+esc(l.n)+'</span>').join('');
    mk.bindPopup('<div class="pop"><b>'+esc(s.n)+'</b>'+
      (s.star?'<div class="ar">★ '+esc(s.star)+'</div>':'')+
      (RAIL.USE[s.n]?'<div class="ls">'+esc(RAIL.USE[s.n])+'</div>':'')+
      (lines?'<div style="margin-top:6px">'+lines+'</div>':'')+'</div>',{maxWidth:250});
    add(L.marker(rxy(s),{interactive:false,icon:L.divIcon({className:'',iconSize:[0,0],
      iconAnchor:[-13,7],
      html:'<div class="rlbl'+(big?' big':'')+(s.star?' star':'')+
        (lay.BELOW.indexOf(id)>=0?' btm':(lay.LEFT.indexOf(id)>=0?' lft':''))+
        (on?'':' dimmed')+'"><b>'+esc(s.n)+'</b>'+
        (s.tag?'<small>'+esc(s.tag)+'</small>':'')+'</div>'})}));
  });
  renderRailMeta(lay,hi);
  railFit();
  $('#railNote').innerHTML='可雙指縮放、拖曳，點擊站點可查看此站在行程中的用途。這張圖不需要網路，離線時最可靠。'+
    (hi?'<br><b style="color:var(--accent)">橘色光圈＝'+md(DAYS[+railDay].d)+' 當天會經過的站</b>'+
        (nMatch<=2?'<br><span style="color:var(--warn)">這天幾乎不搭電車，主要靠步行；行程頁的步行地圖會更有用。</span>':'')
      :(railDay!=='all'?'<br><b style="color:var(--warn)">'+md(DAYS[+railDay].d)+
        ' 當天的移動不在這張圖的範圍內，已顯示完整路網；可切換上方的另外兩張圖。</b>':''));
}
const RAILZOOM={osaka:-2,kansai:-2.25,kyoto:-2};
const RAILSHIFT={osaka:-19,kansai:-13,kyoto:-20};
function railBBox(){
  const S=RAIL.LAYOUTS[railLay].S;
  return L.latLngBounds(Object.values(S).map(rxy));
}
/* 密集示意圖不能硬塞進畫面：固定一個讀得清楚的縮放，讓人用拖曳看。
   位移是為了讓左側那排站名標籤不被切掉。 */
function railFit(){
  const c=railBBox().getCenter();
  railMap.setView([c.lat,c.lng+(RAILSHIFT[railLay]||0)*RSC],RAILZOOM[railLay]);
}
function railWhole(){

}

/* 行程項目也納入搜尋 */
function searchItinerary(kw){
  if(!kw)return [];
  const out=[],P=allPOI();
  DAYS.forEach((d,i)=>dayItems(i).forEach(x=>{
    const o=x.o?P[x.o]:null;
    const hay=(x.n+' '+(x.x||'')+' '+(o?o.n+' '+(o.ja||''):'')).toLowerCase();
    if(hay.includes(kw))out.push({di:i,x,o});
  }));
  return out.slice(0,12);
}
function renderPlaces(){
  const kw=q.trim().toLowerCase();
  const rank={'必去':0,'已排入':1,'只經過':2,'待決定':3,'暫不加入':4,'備選':5};

    gmUrl:gview(o),igUrl:igLink(o),igOfficial:false,area:'__mine',kind:o.kind==='food'?'餐飲':(o.kind==='shop'?'購物':'景點'),
    status:'我的地點',days:(PD[id]||[]).map(d=>d+1),mine:1,id,poi:o
  }));
  const master=MASTER_PLACES.map(o=>{
    const pid=MASTER_LINK[o.no],p=pid?POI[pid]:null;
    return Object.assign({},o,{poi:p,pid,
      note:[o.note,p&&p.hours?'營業 '+p.hours:'',p&&p.best?p.best:''].filter(Boolean).join('　·　')});
  });
  let list=master.concat(mineList).filter(o=>{
    if(areaFilter!=='all'&&o.area!==areaFilter)return false;
    if(statusFilter!=='all'){
      if(['必去','已排入','備選','待決定','我的地點'].indexOf(statusFilter)>=0){if(o.status!==statusFilter)return false}

    }
    if(!kw)return true;
    const hay=(o.n+' '+(o.note||'')+' '+o.area+' '+o.kind+' '+o.status+' '+
      (o.poi?(o.poi.ja||'')+' '+(o.poi.memo||''):'')).toLowerCase();
    return hay.includes(kw);
  });
  list.sort((a,b)=>(rank[a.status]??(a.mine?0.5:9))-(rank[b.status]??(b.mine?0.5:9))||
    String(a.no).localeCompare(String(b.no),'zh-Hant',{numeric:true}));
  const groups={};list.forEach(o=>(groups[o.area]=groups[o.area]||[]).push(o));

    '<b>來源：</b>大阪_地圖清單整理.xlsx（113 筆）＋你自己新增的地點。每天行程只顯示已排入的地點，其餘保留為備選。</div>'+
    '<button class="iconbtn g" id="addPlace" aria-label="新增自訂地點">'+IC.plus+'</button></div></div>';
  if(!list.length){
    $('#placeBody').innerHTML=h+'<div class="empty">找不到符合的地點。<br>可搜尋店名、日文名、筆記、城市或狀態。</div>';
    $('#addPlace').onclick=()=>openPlaceSheet(null);
    bindPlaceJump();return;
  }
  h+=order.map(a=>'<div class="sec" style="margin-top:20px"><i></i><h2>'+
    (a==='__mine'?'我的地點':esc(a))+'</h2><span class="cnt">'+groups[a].length+'</span></div>'+
    groups[a].map(o=>{
      const stClass=(o.status==='必去'||o.status==='已排入')?'ok':
        (o.status==='待決定'||o.status==='暫不加入'?'wr':(o.mine?'mine':'g'));
      const p=o.poi;
      return '<div class="pl"><div class="plh"><div class="idx">'+

        '<div class="n">'+esc(o.n)+'</div>'+
        (p&&p.ja&&p.ja!==o.n?'<div class="ja">'+esc(p.ja)+'</div>':'')+
        (o.note?'<div class="pnote">'+esc(o.note)+'</div>':'')+

        '<span class="pill '+stClass+'">'+esc(o.status)+'</span>'+

function askGeo(force){
  if(!navigator.geolocation){geoState='no';renderNear();return}
  if(geo&&!force){renderNear();return}
  geoState='ask';renderNear();
  navigator.geolocation.getCurrentPosition(
    p=>{geo={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
      geoState='ok';renderNear();if(mapObj)showMe()},
    e=>{geoState=e.code===1?'deny':'fail';renderNear()},
    {enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}
function renderPChips(){
  const o=[['all','全部'],['1','P1 一定要去'],['2','P2 順路必去'],['3','P3 時間寬裕']];
  $('#pChips').innerHTML=o.map(([v,l])=>
    '<button class="chip'+(pFilter===v?' on plain':'')+'" data-p="'+v+'">'+l+'</button>').join('');
  $$('#pChips .chip').forEach(b=>b.onclick=()=>{pFilter=b.dataset.p;renderPChips();renderNear()});
}
function nbCard(x){
  const o=x.o,PD=poiDays(),days=PD[x.id]||[];
  return '<div class="nb"><div class="dist"><b>'+fmtD(x.d)+'</b><span>'+walkTxt(x.d)+'</span></div>'+
    '<div class="mid"><div class="n">'+esc(o.n)+'</div>'+

    (o.kind==='shop'?'<span class="pill g">購物</span>':'')+
    days.map(i=>'<span class="pill d" data-jumpd="'+i+'">D'+(i+1)+'</span>').join('')+
    (o.reserve?'<a class="pill g" href="'+esc(o.reserve)+'" target="_blank" rel="noopener">訂位</a>':'')+

    '<a class="iconbtn" href="'+gview(o)+'" target="_blank" rel="noopener" aria-label="在 Google Maps 開啟">'+IC.mapPin+'</a></div>';

function renderNear(){
  const M={idle:['','準備定位…'],
    ask:['','正在取得你的位置，請允許瀏覽器的定位權限。'],
    ok:['ok','已定位。以下依直線距離由近到遠排序。'],
    deny:['err','定位權限被拒絕。請到瀏覽器設定開啟此頁的定位，或改用下方的區域清單。'],
    fail:['err','抓不到 GPS 訊號（室內或地下街常見）。走到戶外再試一次，或改用下方的區域清單。'],
    no:['err','這個瀏覽器不支援定位，請改用下方的區域清單。']}[geoState]||['',''];
  $('#gpsBox').innerHTML='<div class="gpsbar '+M[0]+'">'+M[1]+
    (geo&&geo.acc>0?'<br><span class="xs">精度約 ±'+Math.round(geo.acc)+' 公尺</span>':'')+'</div>'+
    '<div class="btns" style="margin:0 0 13px"><button class="btn'+(geo?'':' pri')+'" id="reGeo">'+
    IC.near+(geo?'重新定位':'開啟定位')+'</button></div>';
  $('#reGeo').onclick=()=>askGeo(true);

  const P=allPOI();
  const entries=Object.entries(P).filter(([,o])=>(o.p||0)>0)
    .filter(([,o])=>pFilter==='all'||o.p===+pFilter);
  let h='';
  if(geo){
    const s=entries.filter(([,o])=>Number.isFinite(o.lat))
      .map(([id,o])=>({id,o,d:dist(geo.lat,geo.lng,o.lat,o.lng)})).sort((a,b)=>a.d-b.d);
    const near=s.filter(x=>x.d<=5),far=s.filter(x=>x.d>5);
    h+='<div class="sec"><i></i><h2>5 公里內</h2><span class="cnt">'+near.length+' 個</span></div>';
    h+=near.length?near.map(nbCard).join('')
      :'<div class="empty">這附近 5 公里內沒有行程上的景點。<br>下面是其餘地點依距離排序。</div>';
    if(far.length)h+='<div class="sec" style="margin-top:22px"><i></i><h2>再遠一點</h2>'+
      '<span class="cnt">前 '+Math.min(far.length,16)+' 個</span></div>'+far.slice(0,16).map(nbCard).join('');
  }else{
    /* 沒有 GPS 時：用 POI 自己的細分區域列出全部，不再被地點總表的粗分區域洗掉 */
    h+='<div class="sec"><i></i><h2>依區域瀏覽</h2><span class="cnt">'+entries.length+' 個地點</span></div>';
    const areas=[...new Set(entries.map(([,o])=>o.area).filter(Boolean))];
    h+=areas.map(a=>{
      const items=entries.filter(([,o])=>o.area===a);
      if(!items.length)return '';
      return '<div class="card"><div class="b sm" style="margin-bottom:2px">'+esc(a)+
        '<span class="xs muted">　'+items.length+' 個地點</span></div>'+
        items.map(([id,o])=>'<div class="row sp" style="padding:9px 0;border-top:1px solid var(--line2)">'+
        '<div style="min-width:0"><div class="sm b">'+esc(o.n)+'</div>'+
        (o.hours?'<div class="xs muted" style="margin-top:2px">'+esc(o.hours)+'</div>':'')+'</div>'+
        '<div class="row" style="flex:0 0 auto;gap:8px"><span class="pill p'+o.p+'">P'+o.p+'</span>'+
        '<a class="iconbtn" href="'+gview(o)+'" target="_blank" rel="noopener" aria-label="在 Google Maps 開啟 '+esc(o.n)+'">'+IC.mapPin+'</a>'+
        '</div></div>').join('')+'</div>'}).join('');
  }
  $('#nearBody').innerHTML=h;
  $$('#nearBody [data-jumpd]').forEach(b=>b.onclick=()=>{curDay=+b.dataset.jumpd;go('plan')});
}

      '<button class="btn" id="bkDl">'+IC.dl+'下載檔案</button></div>'+
    '<div class="sec"><i></i><h2>還原到這支裝置</h2></div>'+
    '<div class="fld"><label>貼上另一支手機複製的備份內容</label>'+
      '<textarea class="io" id="bkIn" placeholder=\'{"_app":"kansai-2026",…}\'></textarea>'+
      '<div class="hint">還原會覆蓋這支手機目前的打勾、筆記、A/B 選擇、自訂行程與地點。</div></div>'+
    '<div class="btns" style="margin-top:0"><button class="btn pri" id="bkIn2">'+IC.up+'匯入並覆蓋</button></div>'+
    '<div class="sec"><i></i><h2>清除</h2></div>'+
    '<div class="btns" style="margin-top:0"><button class="btn dgr" id="bkClrMarks">清除打勾與筆記</button>'+
      '<button class="btn dgr" id="bkClrAll">全部重設</button></div>',
    root=>{
      root.querySelector('#bkCopy').onclick=()=>copy(json);
      root.querySelector('#bkDl').onclick=()=>{
        try{
          const blob=new Blob([json],{type:'application/json'});
          const a=document.createElement('a');
          a.href=URL.createObjectURL(blob);
          a.download='kansai-2026-backup-'+new Date().toISOString().slice(0,10)+'.json';
          document.body.appendChild(a);a.click();a.remove();
          setTimeout(()=>URL.revokeObjectURL(a.href),3000);
          toast('已開始下載');
        }catch(e){toast('這個瀏覽器不允許下載，請改用複製')}
      };
      root.querySelector('#bkIn2').onclick=()=>{
        const raw=root.querySelector('#bkIn').value.trim();
        if(!raw){toast('請先貼上備份內容');return}
        let obj;
        try{obj=JSON.parse(raw)}catch(e){toast('格式不正確，不是有效的備份');return}
        if(!obj||obj._app!=='kansai-2026'||!obj.data){toast('這不是本行程的備份檔');return}
        if(!confirm('確定要覆蓋這支手機目前的資料嗎？'))return;
        Object.entries(obj.data).forEach(([k,v])=>{v===null?store.del(k):store.set(k,v)});
        closeSheet();toast('已匯入');boot();
      };
      root.querySelector('#bkClrMarks').onclick=()=>{
        if(!confirm('清除所有打勾與筆記？自訂行程與地點會保留。'))return;
        store.set('done',{});store.set('notes',{});store.set('checks',{});
        closeSheet();toast('已清除');boot();
      };
      root.querySelector('#bkClrAll').onclick=()=>{
        if(!confirm('全部重設會連自訂行程、自訂地點、地址與匯率一起清掉，確定嗎？'))return;
        store.keys().forEach(k=>store.del(k));
        closeSheet();toast('已重設');boot();
      };
    });
}
