    '<div class="segsel" id="thSel">'+THEMES.map(v=>
      '<button data-v="'+v+'" class="'+(t===v?'on':'')+'">'+THEME_LBL[v]+'</button>').join('')+'</div>'+
    '<div class="hint">「自動」會跟著手機的深色模式切換。</div>'+
    '<div class="btns"><button class="btn pri" id="bkBtn">'+IC.save+'資料備份與還原</button>'+
    '<button class="btn" id="pvBtn3">'+IC.eye+'預覽模式</button></div></div>';

  h+='<div class="sec"><i></i><h2>關於這個檔案</h2></div><div class="card"><div class="sm ink2" style="line-height:1.9">'+
    '單一 HTML 檔。行程、地點、路網圖、日文短句、緊急電話都內建，<b>不用連網也看得到</b>；'+
    '需要網路的只有概覽圖與步行地圖的底圖，以及點開 Google Maps／官網／IG。<br><br>'+
    '打勾、筆記、A/B 選擇、自訂行程與地點、地址、匯率都存在這支手機的瀏覽器裡'+
    (store.ok()?'':'（<b>目前這個環境不允許儲存，重新整理後會清空</b>）')+
    '；換裝置請用上面的「資料備份與還原」搬過去。<br><br>'+
    '標示「位置概略」的地點代表座標只到區域級，地圖連結會改用日文名稱搜尋。<br><br>'+
    '<b>建議用法：</b>在手機瀏覽器打開後選「加入主畫面」，就會像 App 一樣全螢幕開啟。</div></div>';

  $('#utilBody').innerHTML=h;

  $$('#utilBody [data-edit]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.edit;
    const v=prompt(k==='addr_kyoto'?'京都住宿日文地址：':'大阪住宿日文地址（日文原文，給司機看）：',store.get(k,''));
    if(v!==null){store.set(k,v.trim());renderUtil()}});
  $$('#utilBody [data-cp2]').forEach(b=>b.onclick=()=>copy(b.dataset.cp2,b));
  $$('#utilBody .ck').forEach(el=>{
    const flip=()=>{const i=el.dataset.ci,o=checks();o[i]=!o[i];if(!o[i])delete o[i];
      store.set('checks',o);el.classList.toggle('on',!!o[i]);
      el.setAttribute('aria-checked',o[i]?'true':'false')};
    el.onclick=flip;
    el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};
  });
  const J=$('#fxJ'),Tw=$('#fxT'),R=$('#fxR');
  const r=()=>parseFloat(R.value)||0;
  const fromJ=()=>{Tw.value=((parseFloat(J.value)||0)*r()).toFixed(1)};
  const fromT=()=>{J.value=r()?Math.round((parseFloat(Tw.value)||0)/r()):''};
  J.oninput=fromJ;Tw.oninput=fromT;
  R.oninput=()=>{store.set('rate',r()||0.21);fromJ()};
  fromJ();
  const pq=$('#phQ');
  pq.oninput=()=>{
    $('#phList').innerHTML=phraseHTML(pq.value.trim().toLowerCase());
    $('#phBox').classList.toggle('has',!!pq.value);
    bindPhrase();
  };
  bindPhrase();
  $('#addPlace2').onclick=()=>openPlaceSheet(null);
  $$('#utilBody [data-editpl2]').forEach(b=>b.onclick=()=>openPlaceSheet(b.dataset.editpl2));
  const th=$('#thSel');
  th.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    store.set('theme',b.dataset.v);applyTheme();
    th.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    if(mapObj)drawMarkers();
  });
  $('#bkBtn').onclick=openBackupSheet;
  $('#pvBtn3').onclick=openPreviewSheet;
}
function phraseHTML(kw){
  const out=PHRASES.map(g=>{
    const rows=g.l.filter(([zh,ja,ro])=>!kw||(zh+ja+ro).toLowerCase().includes(kw));
    if(!rows.length)return '';
    return '<div class="card"><div class="b sm" style="color:var(--day);margin-bottom:3px">'+esc(g.g)+'</div>'+
      rows.map(([zh,ja,ro])=>'<div class="ph"><div class="txt"><div class="zh">'+esc(zh)+'</div>'+
      '<div class="ja">'+esc(ja)+'</div><div class="ro">'+esc(ro)+'</div></div>'+
      '<button class="iconbtn g" data-cp3="'+esc(ja)+'" aria-label="複製日文">'+IC.copy+'</button></div>').join('')+'</div>';
  }).join('');
  return out||'<div class="empty">找不到符合的短句。</div>';
}
function bindPhrase(){$$('#phList [data-cp3]').forEach(b=>b.onclick=()=>copy(b.dataset.cp3,b))}

/* ============ 導覽 ============ */
const TABS=[['now','今日',IC.home],['plan','行程',IC.list],['map','地圖',IC.map],
            ['place','地點',IC.pin],['near','附近',IC.near],['util','工具',IC.tool]];
$('#nav').innerHTML=TABS.map(([v,l,i])=>'<button data-v="'+v+'" aria-label="'+l+'">'+i+l+'</button>').join('');
function go(v){
  curView=v;
  $$('#nav button').forEach(b=>{
    const on=b.dataset.v===v;b.classList.toggle('on',on);
    b.setAttribute('aria-current',on?'page':'false');
  });
  $$('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  window.scrollTo(0,0);
  if(v==='now')renderNow();
  if(v==='plan'){renderChips();renderPlan()}
  if(v==='map'){
    renderMapChips();
    if(mapMode==='rail'){renderRailChips();initRail()}
    else if(mapMode==='geo')initMap();
    else renderGoogleHub();
  }
  if(v==='place'||v==='near'||v==='util'){
    const i=nowInfo().di;setDayTheme(DAYS[i>=0?i:curDay].th);
  }
  if(v==='place'){renderAreaChips();renderStatusChips();renderPlaces()}
  if(v==='near'){renderPChips();(!geo&&geoState==='idle')?askGeo():renderNear()}
  if(v==='util')renderUtil();
  renderBanners();
}
$$('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));

/* 地圖控制列 */
$('#locBtn').innerHTML=IC.near+'我的位置';
$('#fitBtn').innerHTML=IC.map+'重新置中';
$('#tileBtn').innerHTML=IC.spot+'換底圖';
$('#locBtn').onclick=()=>{geo?showMe():askGeo(true)};
$('#fitBtn').onclick=()=>drawMarkers();
$('#tileBtn').onclick=()=>useTiles(tileIdx+1,true);
$$('#mapSeg button').forEach(b=>b.onclick=()=>{
  setMapMode(b.dataset.mode);renderMapChips();
  if(mapMode==='rail'){renderRailChips();initRail()}
  else if(mapMode==='geo')initMap();
  else renderGoogleHub();
});
$('#railFit').onclick=()=>railFit();
$('#railWhole').onclick=()=>railWhole();
$$('#railSeg button').forEach(b=>b.onclick=()=>{
  railLay=b.dataset.lay;
  $$('#railSeg button').forEach(x=>x.classList.toggle('on',x===b));
  drawRail();
});
$('#q').oninput=e=>{q=e.target.value;$('#searchBox').classList.toggle('has',!!q);renderPlaces()};
$('#qClr').onclick=()=>{q='';$('#q').value='';$('#searchBox').classList.remove('has');renderPlaces();$('#q').focus()};
$('#themeBtn').onclick=()=>{
  const t=theme(),next=THEMES[(THEMES.indexOf(t)+1)%THEMES.length];
  store.set('theme',next);applyTheme();toast('主題：'+THEME_LBL[next]);
  if(curView==='util')renderUtil();
  if(mapObj)drawMarkers();
};

/* ============ 離線偵測 ============ */
function setOffline(v){
  if(offline===v)return;
  offline=v;renderBanners();
  if(curView==='map'&&mapMode==='google')renderGoogleHub();
  if(v)toast('已離線：行程、路網圖、短句仍可使用');
}
window.addEventListener('online',()=>setOffline(false));
window.addEventListener('offline',()=>setOffline(true));

/* ============ 啟動 ============ */
function boot(){
  applyTheme();
  const info=nowInfo();
  if(info.di>=0){curDay=info.di;mapDay=info.di;railDay=info.di}
  const saved=store.get('mapmode','google');
  setMapMode(['google','geo','rail'].indexOf(saved)>=0?saved:'google');
  $('#topsub').textContent='11/7（六）- 11/15（日）· 9 天 8 夜'+
    (info.real?'':' · 預覽中');
  go(curView||'now');
}
boot();

/* 每分鐘刷新「今日」（僅在頁面上方、真實時間時） */
setInterval(()=>{
  if(curView==='now'&&window.scrollY<40&&nowInfo().real)renderNow();
},60000);
window.addEventListener('resize',()=>{
  if(mapObj)mapObj.invalidateSize();
  if(railMap)railMap.invalidateSize();
  if(walkMapObj)walkMapObj.invalidateSize();
});
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&curView==='now'&&nowInfo().real)renderNow();
});

</script>
</body>
</html>
